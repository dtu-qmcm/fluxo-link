# WAY 2 of 2 for the FluxML corpus — "record the dataset, not its contents".
#
# Same source as linea_fluxml_materialised.yaml (Way 1): one 56-line FluxML
# document. Here the file is referenced with a checksum and nothing is
# re-described. Runnability is assessed by scripts/check_runnable.py.
#
# THE FORMER HEADLINE PROBLEM AT THIS TIER, now resolved: a single .fml is
# network + tracer + measurements + simulation + configuration all at once.
# With a single-valued SourceFile.role this forced either one entry with one
# role (four roles unrecorded) or five entries with the same path and checksum
# (one file declared five times). SourceFile.role is now multivalued, so the
# file is declared once with all five roles, and the run references it by id.
#
# Tally: 0 FABRICATED (the placeholder software version and the optimizer were
# deleted), 0 LOST.
id: FLUXO_DS_linea_fluxml_catalog
name: Linea — FluxML model record (catalog tier)
description: >-
  Provenance record for the linea.fml FluxML document. Input content is
  referenced, not re-described.
schema_version: "0.1.0"
dataset_type: catalog
fluxo_ontology_version: "2026-03-03"

source_files:
  - id: SF_linea
    path: linea.fml
    format: FluxML
    role: [network, tracer, mid_measurements, simulation, configuration]
    checksum: "sha256:ebef2be79ee2041eca073facad7076fae04ccf0439e784d6724f921f82278217"
    media_type: application/xml
    file_size_bytes: 1920
    description: >-
      <info> (Linea, Stratmann, v1.0, 2020-07-24 20:33:00); <reactionnetwork>:
      3 pools, 3 reactions, letter cfg notation; configuration "default"
      (stationary="false"): <input pool="S"> 0.1 unlabelled / 0.9 [1-13C],
      groups MS_A and MS_B with 4 datums at t=1.0, <simulation
      method="cumomer">, no <variables>.

investigations:
  - id: INV_linea
    name: Linea straight-line model
    description: Academic straight line network model
    contributors:
      - id: CONTRIB_stratmann
        name: Stratmann

# No `networks` block: the real network is inside SF_linea and stays there.
# network_model_id is `recommended`, and the FluxoDataset tier rule requires
# materialised networks only at `dataset_type: benchmark`.

# No `experiments` block: tracer and measurement content stays in the .fml.
# Which <configuration> the run uses is recorded on the run itself
# (configuration_name), and its stationary="false" as fluxomics_method.

simulation_runs:
  # linea.fml is a runnable input with no results: run_status planned says so,
  # so this is no longer indistinguishable from a run whose results were simply
  # not extracted.
  - id: RUN_linea_planned
    investigation_id: INV_linea
    configuration_name: default
    # From stationary="false".
    fluxomics_method: INST_MFA
    run_status: planned
    software:
      # FluxML is 13CFLUX2's native format; the file names no tool or version.
      id: SW_13cflux2
      software_name: 13CFLUX2
    input_format: FluxML
    # From <simulation method="cumomer">; @type is absent (FluxML default
    # "auto"), so there is no non-default setting to record.
    isotopic_state_space: cumomer
    # stationary="false" needs a time grid: <group times="1.">. The .fml states
    # no stop time and no time unit.
    integration_timespan: [1.0]
    input_files: [SF_linea]
    # No output_files, no flux_solution, no goodness_of_fit: nothing was run.
