id: https://w3id.org/fluxolink
name: fluxolink
title: FluxoLink
description: >-
  A LinkML data model for metabolic flux analysis (MFA) investigations,
  including isotope-based MFA (13C-MFA, IST-MFA, INST-MFA) and
  stoichiometry-based methods (FBA). Grounded in the FLUXO ontology.
  Supports data from tools such as freeflux, 13CFLUX2, influx_si, INCA,
  COBRApy, and others.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  fluxo: http://purl.obolibrary.org/obo/
  obo: http://purl.obolibrary.org/obo/
  schema: http://schema.org/
  ORCID: http://identifiers.org/orcid/

default_prefix: fluxo
default_range: string

imports:
  - linkml:types
  - enumerations
  - investigation
  - network
  - experiment
  - simulation_run

classes:
  FluxoDataset:
    class_uri: fluxo:FLUXO_0000002
    tree_root: true
    description: >-
      Root container aggregating all studies, networks, experiments,
      and simulation runs in a fluxomics dataset.
    attributes:
      id:
        in_subset: [core]
        description: Unique identifier for this dataset.
        identifier: true
        required: true
      name:
        in_subset: [core]
        description: Human-readable name of the dataset.
      description:
        description: Detailed description of the dataset contents.
      schema_version:
        description: Version of the FluxoLink schema this dataset conforms to.
      creation_date:
        description: Date the dataset was created.
        range: date
      last_modified:
        description: Date the dataset was last modified.
        range: date
      fluxo_ontology_version:
        description: >-
          FLUXO ontology release version used for term mappings (e.g.,
          "2026-04-08"). Pins the ontology version for traceability.
      dataset_type:
        in_subset: [core]
        description: >-
          Classification of this dataset by curation tier. When
          "benchmark", the materialised network is required (LinkML rule
          below) and `fluxolink-validate` re-imposes the strict
          field-level set — tracer fractions and purities, MID values and
          SDs, software versions, and, for experimental data, the
          cultivation condition. When "catalog" or absent, input content
          stays in the referenced SourceFiles.
        range: DatasetTypeEnum
      source_files:
        in_subset: [core]
        description: >-
          Native MFA files referenced by this dataset (FluxML, MTF,
          FTBL, .mat, etc.). Tier-1 provenance layer.
        range: SourceFile
        multivalued: true
        inlined_as_list: true
      conditions:
        in_subset: [core]
        description: >-
          All cultivation conditions in this dataset, defined once and
          referenced by LabelingExperiment.condition and
          SimulationRun.condition. Held at dataset level so one
          cultivation is described exactly once.
        range: Condition
        multivalued: true
        inlined_as_list: true
      investigations:
        in_subset: [core]
        description: All MFA investigations in this dataset.
        range: Investigation
        multivalued: true
        inlined_as_list: true
      networks:
        description: All metabolic network models in this dataset.
        range: MetabolicNetworkModel
        multivalued: true
        inlined_as_list: true
      experiments:
        in_subset: [core]
        description: All labeling experiments in this dataset.
        range: LabelingExperiment
        multivalued: true
        inlined_as_list: true
      simulation_runs:
        in_subset: [core]
        description: All simulation runs in this dataset.
        range: SimulationRun
        multivalued: true
        inlined_as_list: true
    rules:
      - title: benchmark_tier_requires_input_ground_truth
        description: >-
          A benchmark-tier dataset carries Tier-2 input ground truth, so
          the network it is benchmarked against must be materialised in
          the document rather than only referenced as native files.
          Catalog-tier datasets (and datasets that leave dataset_type
          absent) are exempt: they record results plus file-level
          provenance, and their input content stays in the referenced
          SourceFiles.

          `experiments` is deliberately NOT required here. A
          stoichiometry-based run (constraint_based, FBA) has no tracer,
          so requiring a LabelingExperiment would force it to fabricate
          one — the same defect that placeholder networks caused before
          2026-08-24. The real rule is "isotope-based method implies a
          labeling experiment", and it cannot be written in LinkML:
          fluxomics_method lives on SimulationRun, nested, and
          slot_conditions cannot nest. It is enforced by
          `fluxolink-validate --benchmark` (src/fluxolink/validate.py)
          instead, together with every other field-level benchmark
          requirement.
        preconditions:
          slot_conditions:
            dataset_type:
              equals_string: benchmark
        postconditions:
          slot_conditions:
            networks:
              required: true
