# WAY 2 of 2 — "record the dataset, not its contents".
#
# Same source corpus as simple_model_mtf_roundtrip.yaml (Way 1), encoded the
# Tier-1 / PATH_FORWARD Path-B way: the native MTF files are *referenced* with
# checksums, and only the comparable results are structured. Network, tracer and
# measurement content stay in the native files.
#
# This is what `dataset_type: catalog` is meant to express. Two things to note:
#
#   1. A pure catalog dataset IS expressible, as of the tier fix: no `networks`
#      and no `experiments` block appears below, and nothing is fabricated to
#      stand in for them. Previously `SimulationRun.network_model_id` was
#      `required: true` with range MetabolicNetworkModel, which requires >=1
#      metabolite and >=1 reaction, which in turn requires >=1 reactant — so
#      every catalog document had to carry a stub network that was not data.
#      The requirement now lives on FluxoDataset as a rule conditioned on
#      `dataset_type: benchmark`, where materialised input content belongs.
#
#   2. Runnability is assessed by scripts/check_runnable.py, which tries to
#      assemble an influx_si invocation from this file alone. As of the
#      2026-10 revision the record states the invocation itself
#      (command_line, run_mode, solver_options incl. --prefix), and each file's
#      role says which one is the mandatory .miso.
#
# Tally: 0 FABRICATED (the optimizer is gone), 1 LOST (the .log "calcul"
# timestamp).
id: FLUXO_DS_simple_model_mtf_catalog
name: simple_model — influx_si MTF run record (catalog tier)
description: >-
  Provenance-and-results record for one influx_si 7.4.3 forward simulation
  (--noopt) over the simple_model MTF file set. Input content is referenced,
  not re-described.
schema_version: "0.1.0"
dataset_type: catalog
fluxo_ontology_version: "2026-03-03"

# The full file-level record: every native file, typed and checksummed, each
# once. Runs reference them by id.
source_files:
