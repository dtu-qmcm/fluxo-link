# Round-trip of the influx_si MTF corpus at
#   fluxomics_data_converter/data/simple_model/roundtrip_test/MTF_from_mtf/
# encoded by hand as a FluxoDataset, to test whether the schema can hold the
# whole dataset. Inputs (.netw .linp .miso .mflux .cnstr .tvar .opt) plus solver
# output (.tvar.sim .miso.sim .mflux.sim .stat .log .pres.csv).
#
# Values marked "FABRICATED" appear nowhere in the source data but are forced by
# a required slot. Comments marked "LOST" record source information that has no
# slot. See PATH_FORWARD.md §13 / IMPLEMENTATION_PLAN.md Phase 3t.
id: FLUXO_DS_simple_model_mtf
name: simple_model — influx_si MTF round-trip
description: >-
  Eight-reaction toy network fitted by influx_si 7.4.3. Encoded from the MTF
  input set and its solver output to exercise schema coverage.
schema_version: "0.1.0"
dataset_type: benchmark
fluxo_ontology_version: "2026-03-03"

source_files:
  - id: SF_netw
    path: simple_model.netw
    format: MTF
    role: network
    checksum: "sha256:edd48e2b6dfefde4f10439c562078ea1a4837058270d4886968c72edbe568a23"
    media_type: text/tab-separated-values
    file_size_bytes: 370
  - id: SF_linp
    path: simple_model.linp
    format: MTF
