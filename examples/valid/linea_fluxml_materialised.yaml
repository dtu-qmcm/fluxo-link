# WAY 1 of 2 for the FluxML corpus — "materialise the content".
#
# Source: fluxomics_data_converter/data/benchmark/FluxML/linea.fml (56 lines,
# 13CFLUX2's FluxML format). One <reactionnetwork> + one <configuration>.
#
# Values marked FABRICATED appear nowhere in linea.fml but are forced by a
# required slot. Comments marked LOST record source facts with no slot.
#
# Tally after the 2026-10 schema revision: 0 FABRICATED (the Condition block,
# tracer purities, MID atom positions and analytical methods were deleted once
# their slots stopped being required). 1 LOST: <info><date> (see the network).
# Resolved: the multi-role file, <info> version/modeler/comment, v3's dangling
# atom, the configuration name, the raw measurement spec, the time grid, and
# the <simulation> element (now a planned SimulationRun).
id: FLUXO_DS_linea_fluxml
name: Linea — FluxML academic straight-line model
description: Academic straight line network model
schema_version: "0.1.0"
# Tier: catalog with materialised (Tier-2) content. This file records what
# the source states, and the source is not benchmark-complete: linea.fml states no tracer purity.
# `fluxolink-validate --benchmark` lists exactly what a benchmark would need.
dataset_type: catalog
fluxo_ontology_version: "2026-03-03"

source_files:
  # One file, every role it plays.
  - id: SF_linea
    path: linea.fml
    format: FluxML
    role: [network, tracer, mid_measurements, simulation, configuration]
    checksum: "sha256:ebef2be79ee2041eca073facad7076fae04ccf0439e784d6724f921f82278217"
    media_type: application/xml
    file_size_bytes: 1920
    description: >-
      Composite FluxML document: reactionnetwork + one configuration
      (tracer, measurement model, measurement data, simulation).

investigations:
  - id: INV_linea
    name: Linea straight-line model
    contributors:
      # From <info><modeler>Stratmann</modeler>.
      - id: CONTRIB_stratmann
        name: Stratmann

networks:
  - id: NET_linea
    # <info>: name, comment, version, modeler.
    name: Linea
    description: Academic straight line network model
    version: "1.0"
    modeler: Stratmann
    # LOST: <date>2020-07-24 20:33:00</date>. model_date has range datetime,
    # which (JSON-Schema date-time) requires a UTC offset that FluxML does not
    # give; adding one would invent it. (It used to be parked, date-only, on
    # FluxoDataset.creation_date, which dates the dataset, not the model.)
    metabolites:
      - {id: S, n_tracked_atoms: 1}
      - {id: A, n_tracked_atoms: 1}
      - {id: B, n_tracked_atoms: 1}
    reactions:
      # v1: <reduct S cfg="a"/> -> <rproduct A cfg="a"/>, bidirectional="false"
      - id: v1
        reversibility: false
        reactants: [{metabolite_id: S}]
        products: [{metabolite_id: A}]
        atom_transition_variants:
          - variant_id: v1_v1
            transitions:
              - {reactant_metabolite_id: S, reactant_atom_index: 1, product_metabolite_id: A, product_atom_index: 1, annotation_type: letter}
      # v2: bidirectional="true" — a genuinely reversible reaction.
      - id: v2
        reversibility: true
        reactants: [{metabolite_id: A}]
        products: [{metabolite_id: B}]
        atom_transition_variants:
          - variant_id: v2_v1
            transitions:
              - {reactant_metabolite_id: A, reactant_atom_index: 1, product_metabolite_id: B, product_atom_index: 1, annotation_type: letter}
      # v3: <reduct id="B" cfg="a"/> and NO <rproduct> at all — an efflux that
      # consumes a tracked carbon. The transition has no product side: B's
      # atom 1 leaves the system.
      - id: v3
        reversibility: false
        reaction_type: sink
        reactants: [{metabolite_id: B}]
        atom_transition_variants:
          - variant_id: v3_v1
            transitions:
              - {reactant_metabolite_id: B, reactant_atom_index: 1, annotation_type: letter}

experiments:
  # From <configuration name="default" stationary="false">.
  - id: EXP_linea_default
    name: default
    configuration_name: default
    investigation_id: INV_linea
    network_model_id: NET_linea
    stationary: false
    source_files: [SF_linea]
    # linea.fml declares no <timeunit>, so time_unit is absent.
    tracer_summary: 90% [1-13C] S, 10% unlabelled
    labeled_sources:
      # <input pool="S"> (no @type: FluxML's default, isotopomer) with two
      # <label> children. <label> has no purity attribute here.
      - id: SRC_S
        metabolite_id: S
        input_type: isotopomer
        tracers:
          - {labeling_pattern: "0", tracer_fraction: 0.1}
          - {labeling_pattern: "1", tracer_fraction: 0.9}
    mid_measurements:
      # <group id="MS_A" times="1."><textual>A#M0,1</textual></group>
      # The spec has no bracket (the whole molecule), so atom_positions is
      # absent and measurement_spec carries the spec verbatim. FluxML groups
      # carry no analytical method.
      - id: MS_A
        metabolite_id: A
        measurement_spec: "A#M0,1"
        time_points: [1.0]
        data_points:
          - {isotopologue_index: 0, time_point: 1.0, value: 0.1, standard_deviation: 0.001}
          - {isotopologue_index: 1, time_point: 1.0, value: 0.9, standard_deviation: 0.001}
      - id: MS_B
        metabolite_id: B
        measurement_spec: "B#M0,1"
        time_points: [1.0]
        data_points:
          - {isotopologue_index: 0, time_point: 1.0, value: 0.1, standard_deviation: 0.001}
          - {isotopologue_index: 1, time_point: 1.0, value: 0.9, standard_deviation: 0.001}

# The configuration's <simulation method="cumomer"> element, recorded as a run
# that is specified but not executed. linea.fml has NO results and no
# <variables>, so there is no flux_solution and no variables list.
simulation_runs:
  - id: RUN_linea_planned
    investigation_id: INV_linea
    network_model_id: NET_linea
    experiment_id: [EXP_linea_default]
    configuration_name: default
    # From stationary="false".
    fluxomics_method: INST_MFA
    run_status: planned
    software:
      # SoftwareInfo is required. FluxML (namespace www.13cflux.net/fluxml) is
      # 13CFLUX2's native format; the file names no tool or version.
      id: SW_13cflux2
      software_name: 13CFLUX2
    input_format: FluxML
    # <simulation method="cumomer">; @type is absent, i.e. FluxML's default
    # "auto", so there is no non-default setting to put in solver_options.
    isotopic_state_space: cumomer
    # The <group times="1."> grid. linea.fml states no stop time or time unit.
    integration_timespan: [1.0]
    input_files: [SF_linea]
