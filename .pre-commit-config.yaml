# .pre-commit-config.yaml — code-quality gates for the FluxoLink project.
# Run `uv run pre-commit install` to enable, `uv run pre-commit run --all-files` to test.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--config-file, .yamllint.yaml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          - --skip=src/fluxolink/datamodel/*.py,project/*,docs/*,.venv/*
          # ser: serine fragments (Ser2a); pres: influx_si .pres.csv;
          # reduct: FluxML <reduct>; te: a user name in recorded paths
          - --ignore-words-list=ist,onetwo,ser,pres,te,reduct

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
        args: [--ignore-missing-imports]
        files: "^src/"

  - repo: local
    hooks:
      - id: linkml-lint
        name: linkml-lint (schema)
        description: Lint the LinkML schema for structural issues.
        entry: uv run linkml-lint --ignore-warnings src/fluxolink/schema/fluxolink.yaml
        language: system
        files: ^src/fluxolink/schema/.*\.yaml$
        pass_filenames: false

      - id: linkml-validate-examples
        name: linkml-validate (examples)
        description: Validate example datasets against the schema.
        entry: uv run linkml-validate -s src/fluxolink/schema/fluxolink.yaml
        language: system
        files: ^examples/valid/.*\.yaml$
        pass_filenames: true

      - id: gen-pydantic-freshness
        name: gen-pydantic freshness
        description: Fail if the generated Pydantic datamodel is out of sync with the schema.
        entry: scripts/check_pydantic_freshness.sh
        language: system
        files: ^src/fluxolink/schema/.*\.yaml$
        pass_filenames: false
