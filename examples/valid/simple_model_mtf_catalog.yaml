investigations:
  - id: INV_simple_model
    name: simple_model MTF round-trip
    description: >-
      Synthetic eight-reaction network used to verify converter round-trips
      across FluxML, MTF and FreeFlux.

# No `networks` block: the network content stays in SF_netw. Nothing is
# fabricated to stand in for it — SimulationRun.network_model_id is
# `recommended`, not `required`, and the FluxoDataset tier rule demands
# materialised networks only when dataset_type is `benchmark`.

# No `experiments` block either: at the catalog tier the tracer and measurement
# content stays in SF_linp / SF_miso / SF_mflux. The data are a noise-free
# forward simulation (cmfa exact MID), so there is no cultivation Condition to
# record in any case.

simulation_runs:
  - id: RUN_influx_si
    investigation_id: INV_simple_model
    fluxomics_method: IST_MFA
    run_mode: [forward_simulation]
    run_status: completed
    software:
      id: SW_influx_si
      software_name: influx_si
      # From the .def preambles / generated .R ("influx_si version: 7.4.3").
      version: "7.4.3"
    input_format: MTF
    # Verbatim first line of simple_model.log. It differs from the .opt
    # (--clownr 1.e-3 --zc 1.e-4); solver_options records the merged, effective
    # set from the generated simple_model.R.
    command_line: '"/home/te/Projects/data_model/fluxomics_data_model/.venv-MFA_Benchmarking/bin/influx_s.py" "--noopt" "--clownr" "1e-5" "--prefix" "simple_model"'
    # emu=FALSE in the generated .R.
    isotopic_state_space: cumomer
    solver_options:
      - {key: "--prefix", value: simple_model}
      - {key: "--noopt"}
      - {key: "--clownr", value: "1e-5"}
      - {key: "--zc", value: "1.e-4"}
    # .log "code gen" / "end"; zone from the same run's .def preambles.
    # LOST: the .log "calcul" timestamp.
    start_time: "2026-05-12T23:18:59+02:00"
    end_time: "2026-05-12T23:19:01+02:00"
    input_files: [SF_netw, SF_linp, SF_miso, SF_mflux, SF_cnstr, SF_tvar, SF_opt]
    output_files: [SF_cnstr_def, SF_tvar_def, SF_tvar_sim, SF_miso_sim, SF_mflux_sim, SF_stat, SF_pres, SF_log, SF_err, SF_R]
    # The comparable results layer — the reason the catalog tier exists.
    # Extracted from simple_model.tvar.sim; measured-vs-simulated values and the
    # scale factor stay in SF_miso_sim / SF_mflux_sim / SF_pres at this tier.
    #
    # DANGLING REFERENCES: FluxResult.reaction_id has range NetworkReaction, but
    # at this tier no real network is materialised, so R1..F_out resolve to
    # nothing in this document. linkml-validate accepts it (JSON-Schema
    # validation does not check referential integrity), so this works TODAY --
    # but it is exactly what the planned Phase 5 referential-integrity rule
    # (VALIDATION_REQUIREMENTS §3, §5) is specified to reject. The catalog tier
    # is therefore on a collision course with its own validation plan.
    #
    # The 8 XCH rows are omitted here: all have value 0 and SD 0, and
    # FluxTypeEnum.exchange is documented as min(fwd,rev) while influx_si's XCH
    # is the normalised xch01 -- a different quantity (§13.11).
    flux_solution:
      id: SOL_influx_si
      # --noopt: imposed fluxes (the benchmark's ground truth), not estimates.
      solution_role: reference
      flux_results:
        - {reaction_id: R1, flux_type: net, value: 100.0, standard_deviation: 0.0999999999999999, variable_type: free, structural_identifiability: "yes"}
        - {reaction_id: R2, flux_type: net, value: 110.0, standard_deviation: 12.6867790062193, variable_type: free, structural_identifiability: "yes"}
        - {reaction_id: R3, flux_type: net, value: 50.0, standard_deviation: 10.2318802202028, variable_type: free, structural_identifiability: "yes"}
        - {reaction_id: R4, flux_type: net, value: 20.0, standard_deviation: 1.30753659221237, variable_type: dependent, structural_identifiability: "yes"}
        - {reaction_id: R5, flux_type: net, value: 20.0, standard_deviation: 1.30753659221237, variable_type: dependent, structural_identifiability: "yes"}
        - {reaction_id: R6, flux_type: net, value: 80.0, standard_deviation: 1.30982897355889, variable_type: dependent, structural_identifiability: "yes"}
        - {reaction_id: E_out, flux_type: net, value: 60.0, standard_deviation: 3.92260977663711, variable_type: dependent, structural_identifiability: "yes"}
        - {reaction_id: F_out, flux_type: net, value: 80.0, standard_deviation: 1.30982897355889, variable_type: dependent, structural_identifiability: "yes"}
    # simple_model.stat (p-value is influx_si's LOWER tail; parameters = 3 free
    # fluxes + 1 scale factor).
    goodness_of_fit:
      wssr: 2.17872364785429e-16
      number_of_measurements: 5
      number_of_parameters: 4
      degrees_of_freedom: 1
      # influx_si's .stat p-value 1.17771751823129e-08 is the LOWER tail,
      # pchisq(chi2, df); the schema stores the upper tail, 1 - that.
      chi_square_p_value: 0.9999999882228248
      chi_square_confidence_level: 0.95
      fit_accepted: true
      reduced_chi_square: 2.17872364785429e-16
