id: https://w3id.org/fluxolink/experiment
name: fluxolink-experiment
title: FLUXO Experiment Module
description: >-
  Isotope labeling experiment classes including tracer specifications,
  cultivation conditions, and MID / NMR / flux / pool-size measurements.

license: Apache-2.0

prefixes:
  linkml: https://w3id.org/linkml/
  fluxo: http://purl.obolibrary.org/obo/

default_prefix: fluxo
default_range: string

imports:
  - linkml:types
  - enumerations
  - investigation
  - network

classes:
  LabelingExperiment:
    class_uri: fluxo:FLUXO_0000049
    description: >-
      An isotope labeling experiment defining the tracer setup,
      biological condition, and associated measurement data for an
      MFA study.
    attributes:
      id:
        in_subset: [core]
        description: Unique identifier for the experiment.
        identifier: true
        required: true
      name:
        description: Human-readable name of the experiment.
      investigation_id:
        in_subset: [core]
        description: >-
          Reference to the parent investigation. Recommended; required at
          the benchmark tier (`fluxolink-validate --benchmark`).
        range: Investigation
        recommended: true
      condition:
        in_subset: [core]
        description: >-
          Reference to the cultivation condition for this experiment,
          defined once in FluxoDataset.conditions. Recommended: no native
          format carries it, and a synthetic benchmark has no culture.
          Required at the benchmark tier when data_origin is
          experimental.
        range: Condition
        recommended: true
      data_origin:
        in_subset: [core]
        description: >-
          Whether the measurement values are experimental, synthetic or
          simulated. Decides whether cultivation metadata can exist and
          whether natural-abundance handling applies.
        range: DataOriginEnum
      network_model_id:
        description: >-
          Network the experiment's metabolite and reaction references
          resolve against. Needed for referential integrity in a dataset
          with more than one network.
        range: MetabolicNetworkModel
        recommended: true
      configuration_name:
        description: >-
          Native name of this experiment's configuration (FluxML
          <configuration>@name, unique within one .fml; INCA experiment
          id). One FluxML file with several configurations
          (EC.fml: a_INST, b_INST, a_STAT, b_STAT) becomes one
          LabelingExperiment per configuration, sharing one network.
      comment:
        description: >-
          Free-text comment (FluxML <configuration><comment>).
      stationary:
        in_subset: [core]
        description: >-
          Whether the experiment is isotopically stationary (true) or
          non-stationary/INST (false). Must agree with the fluxomics_method
          of every run that uses the experiment, and a non-stationary
          experiment needs time points on its labeling data (both checked
          by `fluxolink-validate`).
        range: boolean
        required: true
      nominal_time:
        description: >-
          Nominal time of the configuration (FluxML <configuration>@time),
          in time_unit.
        range: float
      time_unit:
        description: >-
          Unit of every time value in this experiment (e.g. "s", "min",
          "h"). FluxML <mlabel><timeunit>; INCA sim_tunit.
        slot_uri: fluxo:FLUXO_0000221
      source_files:
        description: >-
          Native files that carry this experiment's content (by id into
          FluxoDataset.source_files). Attributes files to experiments
          explicitly instead of by file-name convention (_a / _b,
          _stat / _inst).
        range: SourceFile
        multivalued: true
      flux_constraints:
        description: >-
          Flux constraints that apply to this experiment only (FluxML
          per-configuration <constraints>; Syn.fml gives each
          configuration different bounds). Network-level constraints
          apply in addition.
        range: FluxConstraint
        multivalued: true
        inlined_as_list: true
      pool_size_constraints:
        description: >-
          Pool size constraints that apply to this experiment only.
        range: PoolSizeConstraint
        multivalued: true
        inlined_as_list: true
      labeled_sources:
        in_subset: [core]
        description: >-
          Labeled substrate (tracer mixture) specifications. Recommended
          rather than required: FreeFlux sets the tracer in its driver
          script, so a faithful encoding of its tables has none. Required
          at the benchmark tier (`fluxolink-validate`).
        range: LabeledSource
        multivalued: true
        inlined_as_list: true
        recommended: true
      mid_measurements:
        description: MID (mass isotopologue distribution) measurements.
        range: MIDMeasurement
        multivalued: true
        inlined_as_list: true
      nmr_measurements:
        description: 13C NMR isotopomer (multiplet) measurements.
        range: NMRIsotopomerMeasurement
        multivalued: true
        inlined_as_list: true
      flux_measurements:
        description: Measured external flux values.
        range: FluxMeasurement
        multivalued: true
        inlined_as_list: true
      pool_size_measurements:
        description: Measured metabolite pool sizes.
        range: PoolSizeMeasurement
        multivalued: true
        inlined_as_list: true
      flux_ratio_measurements:
        description: Measured flux ratios between reactions.
        range: FluxRatioMeasurement
        multivalued: true
        inlined_as_list: true
      pool_size_ratio_measurements:
        description: Measured pool size ratios between metabolites.
        range: PoolSizeRatioMeasurement
        multivalued: true
        inlined_as_list: true
      tracer_summary:
        description: >-
          Human-readable tracer description for catalog browsing
          (e.g., "100% [1-13C] glucose"). Machine-readable spec
          stays in labeled_sources / native files.

  LabeledSource:
    class_uri: fluxo:FLUXO_0000078
    description: >-
      A labeled source (tracer mixture) supplied to the biological
      system. Consists of one or more isotopically labeled tracer
      isotopomers mixed at specified fractions.
    attributes:
      id:
        in_subset: [core]
        description: Unique identifier for the labeled source.
        identifier: true
        required: true
      name:
        description: >-
          Native name of the tracer mixture (e.g. INCA "1-13C_Gluc"), so a
          tracer can be referred to by the label its tool uses.
      metabolite_id:
        in_subset: [core]
        description: >-
          Reference to the input metabolite in the network model.
        range: NetworkMetabolite
        required: true
      input_type:
        description: >-
          Isotopic state-space representation of the input specification
          (isotopomer, cumomer, or EMU).
        range: IsotopicStateSpaceEnum
      profile:
        description: >-
          Time-varying input profile for non-stationary experiments, as a
          textual list of values (e.g., "0.5, 1.0, 1.5").
      tracers:
        in_subset: [core]
        description: Individual tracer isotopomers in the mixture.
        range: TracerIsotopomer
        multivalued: true
        inlined_as_list: true

  TracerIsotopomer:
    class_uri: fluxo:FLUXO_0000134
    description: >-
      A specific isotopically labeled form of a tracer molecule,
      defined by its labeling pattern, fraction, and purity.
    attributes:
      name:
        description: >-
          Native name of this labelled form (e.g. "[1-13C]Gluc").
      labeling_pattern:
        in_subset: [core]
        description: >-
          Labeling pattern as a binary string where 1 = labeled atom
          and 0 = unlabeled atom (e.g., "100000" for [1-13C]glucose).
          Its length must equal the metabolite's n_tracked_atoms when
          both are known (checked by `fluxolink-validate`).
        required: true
        pattern: "^[01xX]+$"
      tracer_fraction:
        in_subset: [core]
        description: >-
          Proportion of this tracer isotopomer in the labeled source.
          Fractions of one source must not sum above 1.0; a remainder
          below 1.0 is read as natural abundance (checked by
          `fluxolink-validate`). Recommended; required at the benchmark
          tier.
        slot_uri: fluxo:FLUXO_0000138
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        recommended: true
      isotopic_purity:
        in_subset: [core]
        description: >-
          Purity of the isotopic label (e.g., 0.99 for 99 atom % 13C).
          Recommended; required at the benchmark tier.
        slot_uri: fluxo:FLUXO_0000139
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        recommended: true
      cost:
        description: >-
          Relative cost of this tracer, used for optimal experiment
          design.
        slot_uri: fluxo:FLUXO_0000081
        range: float
        minimum_value: 0.0
      profile_values:
        description: >-
          Time-varying labeling profile as a textual formula
          (e.g., "0.5 + 0.5 * sin(t-1.57)") for non-stationary inputs.

  MIDMeasurement:
    class_uri: fluxo:FLUXO_0000143
    description: >-
      A group of MID (mass isotopologue distribution) measurements for
      one metabolite fragment at a given time point.
    attributes:
      id:
        description: Unique identifier for the measurement group.
        identifier: true
        required: true
      metabolite_id:
        description: >-
          Reference to the measured metabolite in the network model.
        range: NetworkMetabolite
        required: true
      fragment_name:
        description: >-
          Native name of the measured fragment (INCA "Ala2", FreeFlux
          "Glu_12345"). Needed to match measured and simulated series.
          The measurement group itself is identified by id.
      measurement_spec:
        description: >-
          Native measurement specification, kept verbatim for round-trip
          (FluxML "Ala[2,3]#M0,1,2", influx_si fragment column).
      atom_positions:
        description: >-
          Traced atom positions (e.g., "2,3" or "1-5"). Recommended;
          required at the benchmark tier unless measurement_spec is given.
        recommended: true
      analytical_method:
        description: >-
          Analytical (mass spectrometry) method for this measurement.
          Recommended: no simulation input format records it. Required at
          the benchmark tier for experimental data.
        slot_uri: fluxo:FLUXO_0000190
        range: AnalyticalMethodEnum
        recommended: true
      analytical_method_other:
        description: >-
          Free-text analytical method, used when analytical_method is
          "other".
      time_points:
        description: >-
          Sampling-time grid of this group for non-stationary experiments
          (FluxML <group>@times). Each data point carries its own
          time_point; grid points with no datum stay recoverable here.
        slot_uri: fluxo:FLUXO_0000056
        range: float
        multivalued: true
      scale_method:
        description: >-
          Scaling method for this measurement group ("auto" = estimate a
          scale factor; "one" = values are already normalised).
        slot_uri: fluxo:FLUXO_0000161
        range: ScaleMethodEnum
      error_model_expression:
        description: >-
          Mathematical expression for the error model (e.g.,
          "sd = 0.01 * value").
        slot_uri: fluxo:FLUXO_0000091
      dataset_id:
        description: Optional run/batch identifier (influx_si "Dataset" column).
      natural_abundance_corrected:
        description: >-
          Whether the MID values have been corrected for natural isotope
          abundance. If true, correction_algorithm should be specified.
        range: boolean
      correction_algorithm:
        description: >-
          Algorithm used for natural isotope correction (e.g., "IsoCor",
          "skyline", "in-house").
      comment:
        description: Optional free-text comment.
      replicate:
        description: >-
          Replicate number (1-based) for this measurement group.
          Carried by miemu; reported in published datasets.
        range: integer
        minimum_value: 1
      data_points:
        description: Individual MID measurement data points.
        range: MIDDataPoint
        multivalued: true
        inlined_as_list: true

  MIDDataPoint:
    description: >-
      A single isotopologue measurement value (one m+i entry in an MID).
    attributes:
      isotopologue_index:
        description: >-
          Isotopologue mass shift index (m+0, m+1, ..., m+n).
        range: integer
        minimum_value: 0
        required: true
      weight:
        description: >-
          Optional MS/MS fragment weight specifier (e.g., "2,3") for
          tandem-MS measurements.
      time_point:
        description: >-
          Sampling time of this value (non-stationary experiments only),
          in the experiment's time_unit. FluxML repeats @time per <datum>
          and influx_si has a Time column per row.
        slot_uri: fluxo:FLUXO_0000056
        range: float
      value:
        description: >-
          Measured abundance of this isotopologue. Not bounded to [0, 1]:
          unscaled groups (scale "auto") hold raw intensities, and real
          files carry tiny negative values. Absent for a declared but
          unmeasured fragment (a template). Recommended; required at the
          benchmark tier.
        range: float
        recommended: true
      standard_deviation:
        description: >-
          Standard deviation (measurement uncertainty) of the value.
          Explicitly required by influx_si and present across all formats.
          Recommended; required at the benchmark tier.
        slot_uri: fluxo:FLUXO_0000208
        range: float
        minimum_value: 0.0
        recommended: true

  FluxMeasurement:
    class_uri: fluxo:FLUXO_0000124
    description: >-
      A measured external flux value for a single reaction.
    attributes:
      id:
        description: Unique identifier for the flux measurement.
        identifier: true
        required: true
      reaction_id:
        description: >-
          Reference to the measured reaction. Give either reaction_id or
          flux_expression.
        range: NetworkReaction
        recommended: true
      flux_expression:
        description: >-
          Measured combination of fluxes when the measurement is not a
          single reaction (FluxML <netflux> body, e.g. "R63-R63b").
      flux_type:
        description: Type of flux (net, forward, backward, exchange).
        range: FluxTypeEnum
        required: true
      value:
        description: >-
          Measured flux value. Absent for a declared but unmeasured flux
          (a template). Recommended; required at the benchmark tier.
        slot_uri: fluxo:FLUXO_0000236
        range: float
        recommended: true
      flux_unit:
        description: Unit of the measured flux (e.g., "mmol/gDW/h").
        slot_uri: fluxo:FLUXO_0000219
      standard_deviation:
        description: >-
          Standard deviation of the flux measurement. Recommended;
          required at the benchmark tier.
        slot_uri: fluxo:FLUXO_0000208
        range: float
        minimum_value: 0.0
        recommended: true
      error_model_expression:
        description: >-
          Error model used instead of a fixed SD (FluxML <errormodel> on
          <netflux>; INCA "f.std = f.val/20").
        slot_uri: fluxo:FLUXO_0000091
      time_point:
        description: Measurement time point (for non-stationary experiments).
        slot_uri: fluxo:FLUXO_0000056
        range: float
      comment:
        description: Optional free-text comment.
      replicate:
        description: >-
          Replicate number (1-based) for this flux measurement.
        range: integer
        minimum_value: 1

  PoolSizeMeasurement:
    class_uri: fluxo:FLUXO_0000062
    description: >-
      A measured metabolite pool size for a single metabolite.
    attributes:
      id:
        description: Unique identifier for the pool size measurement.
        identifier: true
        required: true
      metabolite_id:
        description: >-
          Reference to the measured metabolite. Give either metabolite_id
          or pool_expression.
        range: NetworkMetabolite
        recommended: true
      pool_expression:
        description: >-
          Measured combination of pools when the signal is pooled
          (influx_si .mmet "E+B").
      value:
        description: >-
          Measured pool size value. Absent for a declared but unmeasured
          pool (a template). Recommended; required at the benchmark tier.
        slot_uri: fluxo:FLUXO_0000062
        range: float
        recommended: true
      pool_size_unit:
        description: Unit of the measured pool size (e.g., "mmol/gDW").
        slot_uri: fluxo:FLUXO_0000222
      standard_deviation:
        description: >-
          Standard deviation of the pool size measurement. Recommended;
          required at the benchmark tier.
        slot_uri: fluxo:FLUXO_0000208
        range: float
        minimum_value: 0.0
        recommended: true
      error_model_expression:
        description: Error model used instead of a fixed SD.
        slot_uri: fluxo:FLUXO_0000091
      time_point:
        description: Measurement time point (for non-stationary experiments).
        slot_uri: fluxo:FLUXO_0000056
        range: float
      comment:
        description: Optional free-text comment.
      replicate:
        description: >-
          Replicate number (1-based) for this pool size measurement.
        range: integer
        minimum_value: 1

  NMRIsotopomerMeasurement:
    class_uri: fluxo:FLUXO_0000144
    description: >-
      A group of 13C NMR isotopomer measurements for one metabolite,
      providing positional labeling information via multiplet analysis.
    attributes:
      id:
        description: Unique identifier for the NMR measurement group.
        identifier: true
        required: true
      measurement_spec:
        description: >-
          Native measurement specification, kept verbatim for round-trip
          (e.g. a FluxML <group> textual body).
      metabolite_id:
        description: >-
          Reference to the measured metabolite in the network model.
        range: NetworkMetabolite
        required: true
      analytical_method:
        description: >-
          Analytical method used. Use the generic "NMR" value: the
          1D-13C / 2D-HSQC / 2D-TOCSY sub-types were removed from
          AnalyticalMethodEnum on 2026-08-24 pending a decision on the
          NMR attribute set, so naming them here would promise values
          the enum does not carry.
        range: AnalyticalMethodEnum
      analytical_method_other:
        description: >-
          Free-text analytical method, used when analytical_method is
          "other".
      time_point:
        description: Measurement time point for non-stationary experiments.
        slot_uri: fluxo:FLUXO_0000056
        range: float
      comment:
        description: Optional free-text comment.
      data_points:
        description: Individual NMR isotopomer data points.
        range: NMRIsotopomerDataPoint
        multivalued: true
        inlined_as_list: true

  NMRIsotopomerDataPoint:
    description: >-
      A single 13C NMR multiplet measurement for one carbon position.
    attributes:
      atom_position:
        description: >-
          Carbon position index (1-based) in the metabolite.
        range: integer
        minimum_value: 1
        required: true
      multiplet_type:
        description: >-
          NMR multiplet type indicating the labeling state of neighboring
          carbons. S = singlet, DL = left doublet, DR = right doublet,
          DD = double doublet, T = triplet.
        range: NMRMultipletTypeEnum
        required: true
      value:
        description: Measured fractional abundance of this multiplet.
        range: float
        required: true
        minimum_value: 0.0
        maximum_value: 1.0
      standard_deviation:
        description: Standard deviation of the measurement.
        slot_uri: fluxo:FLUXO_0000208
        range: float
        minimum_value: 0.0
        required: true

  FluxRatioMeasurement:
    class_uri: fluxo:FLUXO_0000029
    description: >-
      A measured flux ratio between two or more reactions.
    attributes:
      id:
        description: Unique identifier for the flux ratio measurement.
        identifier: true
        required: true
      expression:
        description: >-
          Textual formula referencing reaction IDs (e.g.,
          "EMP2_v2/(EMP2_v2 + PPP1_v9)").
        required: true
      value:
        description: Measured ratio value.
        range: float
        required: true
      standard_deviation:
        description: Standard deviation of the ratio.
        slot_uri: fluxo:FLUXO_0000208
        range: float
        minimum_value: 0.0
      comment:
        description: Optional free-text comment.

  PoolSizeRatioMeasurement:
    description: >-
      A measured pool size ratio between two or more metabolites.
    attributes:
      id:
        description: Unique identifier for the pool size ratio measurement.
        identifier: true
        required: true
      expression:
        description: >-
          Textual formula referencing metabolite IDs.
        required: true
      value:
        description: Measured ratio value.
        range: float
        required: true
      standard_deviation:
        description: Standard deviation of the ratio.
        slot_uri: fluxo:FLUXO_0000208
        range: float
        minimum_value: 0.0
      comment:
        description: Optional free-text comment.

  SourceFile:
    class_uri: fluxo:FLUXO_0000227
    description: >-
      Reference to a native MFA file (FluxML, MTF, FTBL, .mat, etc.).
      The schema references the file; Tier-2 classes optionally carry
      its parsed content.
    attributes:
      id:
        in_subset: [core]
        description: Unique identifier for this source file record.
        identifier: true
        required: true
      path:
        in_subset: [core]
        description: >-
          Relative path or URI to the file.
        slot_uri: fluxo:FLUXO_0000297
        required: true
      format:
        in_subset: [core]
        description: Format of the file.
        slot_uri: fluxo:FLUXO_0000229
        range: InputFormatEnum
        required: true
      format_other:
        description: >-
          Free-text file format, used when format is "other".
      role:
        in_subset: [core]
        description: >-
          Role(s) this file plays in the dataset. Multivalued because one
          file often plays several: a FluxML .fml is network, constraints,
          tracer, measurements and simulation setup at once; an INCA .m is
          all of those plus the driver.
        range: FileRoleEnum
        multivalued: true
        required: true
      role_other:
        description: >-
          Free-text role, used when role includes "other".
      checksum:
        in_subset: [core]
        description: >-
          "algorithm:hash" digest (e.g., "sha256:abc123...") for
          content-integrity verification.
        slot_uri: fluxo:FLUXO_0000288
        pattern: "^[a-z0-9]+:[0-9a-f]+$"
      media_type:
        description: >-
          IANA media type / MIME type (e.g., "application/xml",
          "text/csv").
      file_size_bytes:
        description: Size of the file in bytes.
        range: integer
        minimum_value: 0
      description:
        description: Optional free-text description of the file contents.
      generated_by:
        description: >-
          Tool that generated the file, when it was not authored by hand
          (e.g. "txt2ftbl" for influx_si .def files,
          "fluxomics_data_converter").
      generator_version:
        description: Version of the generating tool.
      generation_date:
        description: When the file was generated.
        range: IsoDateTime

  Condition:
    class_uri: fluxo:FLUXO_0000218
    description: >-
      Cultivation conditions for the biological system under study,
      including organism, strain, culture medium, and growth rate.
      Defined once per dataset in FluxoDataset.conditions and referenced
      by LabelingExperiment.condition and SimulationRun.condition, so a
      single cultivation is never described twice.
    attributes:
      id:
        in_subset: [core]
        description: Unique identifier for the condition record.
        identifier: true
        required: true
      name:
        description: Human-readable name for this condition.
      organism_name:
        in_subset: [core]
        description: >-
          Name of the organism (e.g., Escherichia coli). Recommended;
          required at the benchmark tier for experimental data.
        slot_uri: fluxo:FLUXO_0000181
        recommended: true
      strain:
        in_subset: [core]
        description: >-
          Strain designation (e.g., BW25113). Recommended; required at the
          benchmark tier for experimental data.
        slot_uri: fluxo:FLUXO_0000182
        recommended: true
      culture_medium:
        description: Growth medium used for cultivation.
        slot_uri: fluxo:FLUXO_0000184
      specific_growth_rate:
        in_subset: [core]
        description: >-
          Measured specific growth rate of the organism. No native format
          carries it; never auto-fill it from a biomass flux. Recommended;
          required at the benchmark tier for experimental data.
        slot_uri: fluxo:FLUXO_0000084
        range: float
        recommended: true
      growth_rate_unit:
        in_subset: [core]
        description: >-
          Unit for the growth rate (e.g., 1/h). Required whenever
          specific_growth_rate is given.
        slot_uri: fluxo:FLUXO_0000219
