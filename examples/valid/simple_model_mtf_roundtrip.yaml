investigations:
  - id: INV_simple_model
    name: simple_model MTF round-trip
    description: >-
      Synthetic eight-reaction network used to verify converter round-trips
      across FluxML, MTF and FreeFlux.

networks:
  - id: NET_simple_model
    name: simple_model network
    metabolites:
      - {id: A, n_tracked_atoms: 3}
      - {id: B, n_tracked_atoms: 3}
      - {id: C, n_tracked_atoms: 2}
      - {id: D, n_tracked_atoms: 3}
      - {id: E, n_tracked_atoms: 1}
      - {id: F, n_tracked_atoms: 3}
      # Boundary pools: the .netw marks them only by the _ext suffix.
      - {id: E_ext, n_tracked_atoms: 1, is_external: true}
      - {id: F_ext, n_tracked_atoms: 3, is_external: true}
    # Atom indices are 1-based positions in each metabolite's letter string.
    # LOST for every reaction below: the source arrow is "->>" (reversible in
    # mechanism, net >= 0). A boolean cannot distinguish "->>" from "->". Its
    # consequence, the generated NET >= 0 rows, IS now recorded: see the
    # is_auto_generated constraints at the end of this network.
    reactions:
      # R1: A (abc) ->> B (abc)
      - id: R1
        reversibility: false
        reactants: [{metabolite_id: A}]
        products: [{metabolite_id: B}]
        atom_transition_variants:
          - variant_id: R1_v1
            transitions:
              - {reactant_metabolite_id: A, reactant_atom_index: 1, product_metabolite_id: B, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: A, reactant_atom_index: 2, product_metabolite_id: B, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: A, reactant_atom_index: 3, product_metabolite_id: B, product_atom_index: 3, annotation_type: letter}
      # R2: B (abc) ->> D (abc)
      - id: R2
        reversibility: false
        reactants: [{metabolite_id: B}]
        products: [{metabolite_id: D}]
        atom_transition_variants:
          - variant_id: R2_v1
            transitions:
              - {reactant_metabolite_id: B, reactant_atom_index: 1, product_metabolite_id: D, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 2, product_metabolite_id: D, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 3, product_metabolite_id: D, product_atom_index: 3, annotation_type: letter}
      # R3: D (abc) ->> B (abc)
      - id: R3
        reversibility: false
        reactants: [{metabolite_id: D}]
        products: [{metabolite_id: B}]
        atom_transition_variants:
          - variant_id: R3_v1
            transitions:
              - {reactant_metabolite_id: D, reactant_atom_index: 1, product_metabolite_id: B, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: D, reactant_atom_index: 2, product_metabolite_id: B, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: D, reactant_atom_index: 3, product_metabolite_id: B, product_atom_index: 3, annotation_type: letter}
      # R4: B (cab) ->> C (ab) + E (c)
      - id: R4
        reversibility: false
        reactants: [{metabolite_id: B}]
        products: [{metabolite_id: C}, {metabolite_id: E}]
        atom_transition_variants:
          - variant_id: R4_v1
            transitions:
              - {reactant_metabolite_id: B, reactant_atom_index: 2, product_metabolite_id: C, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 3, product_metabolite_id: C, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 1, product_metabolite_id: E, product_atom_index: 1, annotation_type: letter}
      # R5: B (dab) + C (ce) ->> D (abc) + E (d) + E (e)
      # E appears TWICE as a product, receiving different source atoms. Each
      # occurrence is its own participant (instance 1 and 2), and the two E
      # transitions name the occurrence they go to, so they are distinct.
      - id: R5
        reversibility: false
        reactants: [{metabolite_id: B}, {metabolite_id: C}]
        products:
          - {metabolite_id: D}
          - {metabolite_id: E, instance: 1}
          - {metabolite_id: E, instance: 2}
        atom_transition_variants:
          - variant_id: R5_v1
            transitions:
              - {reactant_metabolite_id: B, reactant_atom_index: 2, product_metabolite_id: D, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 3, product_metabolite_id: D, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: C, reactant_atom_index: 1, product_metabolite_id: D, product_atom_index: 3, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 1, product_metabolite_id: E, product_instance: 1, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: C, reactant_atom_index: 2, product_metabolite_id: E, product_instance: 2, product_atom_index: 1, annotation_type: letter}
      # R6: D (abc) ->> F (abc)
      - id: R6
        reversibility: false
        reactants: [{metabolite_id: D}]
        products: [{metabolite_id: F}]
        atom_transition_variants:
          - variant_id: R6_v1
            transitions:
              - {reactant_metabolite_id: D, reactant_atom_index: 1, product_metabolite_id: F, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: D, reactant_atom_index: 2, product_metabolite_id: F, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: D, reactant_atom_index: 3, product_metabolite_id: F, product_atom_index: 3, annotation_type: letter}
      # E_out: E (a) ->> E_ext (a)
      - id: E_out
        reversibility: false
        reaction_type: exchange
        reactants: [{metabolite_id: E}]
        products: [{metabolite_id: E_ext}]
        atom_transition_variants:
          - variant_id: E_out_v1
            transitions:
              - {reactant_metabolite_id: E, reactant_atom_index: 1, product_metabolite_id: E_ext, product_atom_index: 1, annotation_type: letter}
      # F_out: F (abc) ->> F_ext (abc)
      - id: F_out
        reversibility: false
        reaction_type: exchange
        reactants: [{metabolite_id: F}]
        products: [{metabolite_id: F_ext}]
        atom_transition_variants:
          - variant_id: F_out_v1
            transitions:
              - {reactant_metabolite_id: F, reactant_atom_index: 1, product_metabolite_id: F_ext, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: F, reactant_atom_index: 2, product_metabolite_id: F_ext, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: F, reactant_atom_index: 3, product_metabolite_id: F_ext, product_atom_index: 3, annotation_type: letter}
    flux_constraints:
      # simple_model.cnstr: 16 rows, Kind=NET, collapsed losslessly into 8
      # bounds (one >= / <= pair each). flux_type keeps a NET-scoped bound
      # apart from an XCH-scoped one on the same reaction.
      - {id: CNSTR_R1, reaction_id: R1, flux_type: net, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_R2, reaction_id: R2, flux_type: net, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_R3, reaction_id: R3, flux_type: net, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_R4, reaction_id: R4, flux_type: net, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_R5, reaction_id: R5, flux_type: net, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_R6, reaction_id: R6, flux_type: net, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_E_out, reaction_id: E_out, flux_type: net, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_F_out, reaction_id: F_out, flux_type: net, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      # simple_model.cnstr.def: the defaults txt2ftbl wrote for the "->>"
      # arrows, one "NET <id> >= 0" row per reaction.
      - {id: CNSTR_DEF_E_out, reaction_id: E_out, flux_type: net, constraint_type: bound, lower_bound: 0.0, is_auto_generated: true}
      - {id: CNSTR_DEF_F_out, reaction_id: F_out, flux_type: net, constraint_type: bound, lower_bound: 0.0, is_auto_generated: true}
      - {id: CNSTR_DEF_R1, reaction_id: R1, flux_type: net, constraint_type: bound, lower_bound: 0.0, is_auto_generated: true}
      - {id: CNSTR_DEF_R2, reaction_id: R2, flux_type: net, constraint_type: bound, lower_bound: 0.0, is_auto_generated: true}
      - {id: CNSTR_DEF_R3, reaction_id: R3, flux_type: net, constraint_type: bound, lower_bound: 0.0, is_auto_generated: true}
      - {id: CNSTR_DEF_R4, reaction_id: R4, flux_type: net, constraint_type: bound, lower_bound: 0.0, is_auto_generated: true}
      - {id: CNSTR_DEF_R5, reaction_id: R5, flux_type: net, constraint_type: bound, lower_bound: 0.0, is_auto_generated: true}
      - {id: CNSTR_DEF_R6, reaction_id: R6, flux_type: net, constraint_type: bound, lower_bound: 0.0, is_auto_generated: true}

experiments:
  - id: EXP_simple_model
    name: simple_model stationary labeling
    investigation_id: INV_simple_model
    network_model_id: NET_simple_model
    # cmfa exact MID, no noise and no natural abundance (roundtrip_test.ipynb).
    # A forward-simulated benchmark has no cultivation, so no Condition.
    data_origin: simulated
    stationary: true
    source_files: [SF_linp, SF_miso, SF_mflux]
    tracer_summary: 100% [2-13C] A
    labeled_sources:
      # .linp: "A  010  1.0". No purity column, so isotopic_purity is absent.
      - id: SRC_A
        metabolite_id: A
        input_type: isotopomer
        tracers:
          - labeling_pattern: "010"
            tracer_fraction: 1.0
    mid_measurements:
      # .miso: Specie F, Fragment "1,2,3", Dataset F_123. No analytical method
      # is recorded, so analytical_method is absent.
      - id: MID_F_123
        metabolite_id: F
        atom_positions: "1,2,3"
        dataset_id: F_123
        data_points:
          - {isotopologue_index: 0, value: 6.34920635e-05, standard_deviation: 8.34413657e-06}
          - {isotopologue_index: 1, value: 0.800761905, standard_deviation: 0.0227359334}
          - {isotopologue_index: 2, value: 0.198285714, standard_deviation: 0.0226919962}
          - {isotopologue_index: 3, value: 0.000888888889, standard_deviation: 0.000118946889}
    flux_measurements:
      # LOST: .mflux has no Kind column; flux_type=net is the influx_si
      # convention, not data. It has no unit column either, so flux_unit is unset.
      - id: FM_R1
        reaction_id: R1
        flux_type: net
        value: 100.0
        standard_deviation: 0.1

simulation_runs:
  - id: RUN_influx_si
    investigation_id: INV_simple_model
    network_model_id: NET_simple_model
    experiment_id: [EXP_simple_model]
    fluxomics_method: IST_MFA
    # --noopt: labeling simulated at the starting fluxes, nothing fitted. So no
    # optimization_method, converged or iteration_count.
    run_mode: [forward_simulation]
    # .err is empty and the .log reaches "end".
    run_status: completed
    software:
      id: SW_influx_si
      software_name: influx_si
      # From the .cnstr.def / .tvar.def preambles and the generated .R
      # ("influx_si version: 7.4.3"), not from any input file.
      version: "7.4.3"
    input_format: MTF
    # Verbatim first line of simple_model.log.
    command_line: '"/home/te/Projects/data_model/fluxomics_data_model/.venv-MFA_Benchmarking/bin/influx_s.py" "--noopt" "--clownr" "1e-5" "--prefix" "simple_model"'
    # emu=FALSE in the generated .R: influx_si's default cumomer space.
    isotopic_state_space: cumomer
    # The EFFECTIVE options, per the "runtime arguments" block of the generated
    # simple_model.R. The .opt asked for --clownr 1.e-3 --zc 1.e-4; the command
    # line's --clownr 1e-5 won, and --zc came from the .opt.
    solver_options:
      - {key: "--prefix", value: simple_model}
      - {key: "--noopt", description: no optimisation; simulate at the starting point}
      - {key: "--clownr", value: "1e-5", description: from the command line (overrides the .opt value 1.e-3)}
      - {key: "--zc", value: "1.e-4", description: from simple_model.opt commandArgs}
    # .log "code gen" and "end" lines. The .log carries no zone; the .def
    # preambles written by the same run at the same second say CEST +0200.
    # LOST: the .log "calcul" timestamp (23:18:59, start of the R step).
    start_time: "2026-05-12T23:18:59+02:00"
    end_time: "2026-05-12T23:19:01+02:00"
    input_files: [SF_netw, SF_linp, SF_miso, SF_mflux, SF_cnstr, SF_tvar, SF_opt]
    output_files: [SF_cnstr_def, SF_tvar_def, SF_tvar_sim, SF_miso_sim, SF_mflux_sim, SF_stat, SF_pres, SF_log, SF_err, SF_R]
    # simple_model.tvar (NET rows) + simple_model.tvar.def (XCH rows).
    # Dependent rows carry no value: influx_si ignores the .tvar Value of a D
    # row and recomputes it from the free fluxes (R4 = 20 in .tvar.sim, not the
    # 15.59 given). The ignored literal is kept in `comment`.
    variables:
      - {variable_id: R1, variable_kind: net_flux, variable_type: free, value: 100.0}
      - {variable_id: R2, variable_kind: net_flux, variable_type: free, value: 110.0}
      - {variable_id: R3, variable_kind: net_flux, variable_type: free, value: 50.0}
      - {variable_id: R4, variable_kind: net_flux, variable_type: dependent, comment: ".tvar Value 15.593220338983064 (ignored for D rows)"}
      - {variable_id: R5, variable_kind: net_flux, variable_type: dependent, comment: ".tvar Value 1.0169491525423675 (ignored for D rows)"}
      - {variable_id: R6, variable_kind: net_flux, variable_type: dependent, comment: ".tvar Value 40.67796610169487 (ignored for D rows)"}
      - {variable_id: E_out, variable_kind: net_flux, variable_type: dependent, comment: ".tvar Value 8.813559322033901 (ignored for D rows)"}
      - {variable_id: F_out, variable_kind: net_flux, variable_type: dependent, comment: ".tvar Value 20.338983050847435 (ignored for D rows)"}
      - {variable_id: E_out, variable_kind: exchange_flux, variable_type: constrained, value: 0.0, comment: txt2ftbl default (.tvar.def)}
      - {variable_id: F_out, variable_kind: exchange_flux, variable_type: constrained, value: 0.0, comment: txt2ftbl default (.tvar.def)}
      - {variable_id: R1, variable_kind: exchange_flux, variable_type: constrained, value: 0.0, comment: txt2ftbl default (.tvar.def)}
      - {variable_id: R2, variable_kind: exchange_flux, variable_type: constrained, value: 0.0, comment: txt2ftbl default (.tvar.def)}
      - {variable_id: R3, variable_kind: exchange_flux, variable_type: constrained, value: 0.0, comment: txt2ftbl default (.tvar.def)}
      - {variable_id: R4, variable_kind: exchange_flux, variable_type: constrained, value: 0.0, comment: txt2ftbl default (.tvar.def)}
      - {variable_id: R5, variable_kind: exchange_flux, variable_type: constrained, value: 0.0, comment: txt2ftbl default (.tvar.def)}
      - {variable_id: R6, variable_kind: exchange_flux, variable_type: constrained, value: 0.0, comment: txt2ftbl default (.tvar.def)}
    flux_solution:
      id: SOL_influx_si
      # The fluxes were imposed (free fluxes from .tvar, dependents from the
      # stoichiometry), not estimated; they are also the benchmark's ground truth.
      solution_role: reference
      # simple_model.tvar.sim: Type -> variable_type (F free, D dependent,
      # C constrained), Struct_identif -> structural_identifiability. The XCH
      # rows are influx_si's xch01-normalised exchange; all are 0, which reads
      # the same on either scale.
      flux_results:
        - {reaction_id: R1, flux_type: net, value: 100.0, standard_deviation: 0.0999999999999999, variable_type: free, structural_identifiability: "yes"}
        - {reaction_id: R1, flux_type: exchange, value: 0.0, standard_deviation: 0.0, variable_type: constrained, structural_identifiability: "yes"}
        - {reaction_id: R2, flux_type: net, value: 110.0, standard_deviation: 12.6867790062193, variable_type: free, structural_identifiability: "yes"}
        - {reaction_id: R2, flux_type: exchange, value: 0.0, standard_deviation: 0.0, variable_type: constrained, structural_identifiability: "yes"}
        - {reaction_id: R3, flux_type: net, value: 50.0, standard_deviation: 10.2318802202028, variable_type: free, structural_identifiability: "yes"}
        - {reaction_id: R3, flux_type: exchange, value: 0.0, standard_deviation: 0.0, variable_type: constrained, structural_identifiability: "yes"}
        - {reaction_id: R4, flux_type: net, value: 20.0, standard_deviation: 1.30753659221237, variable_type: dependent, structural_identifiability: "yes"}
        - {reaction_id: R4, flux_type: exchange, value: 0.0, standard_deviation: 0.0, variable_type: constrained, structural_identifiability: "yes"}
        - {reaction_id: R5, flux_type: net, value: 20.0, standard_deviation: 1.30753659221237, variable_type: dependent, structural_identifiability: "yes"}
        - {reaction_id: R5, flux_type: exchange, value: 0.0, standard_deviation: 0.0, variable_type: constrained, structural_identifiability: "yes"}
        - {reaction_id: R6, flux_type: net, value: 80.0, standard_deviation: 1.30982897355889, variable_type: dependent, structural_identifiability: "yes"}
        - {reaction_id: R6, flux_type: exchange, value: 0.0, standard_deviation: 0.0, variable_type: constrained, structural_identifiability: "yes"}
        - {reaction_id: E_out, flux_type: net, value: 60.0, standard_deviation: 3.92260977663711, variable_type: dependent, structural_identifiability: "yes"}
        - {reaction_id: E_out, flux_type: exchange, value: 0.0, standard_deviation: 0.0, variable_type: constrained, structural_identifiability: "yes"}
        - {reaction_id: F_out, flux_type: net, value: 80.0, standard_deviation: 1.30982897355889, variable_type: dependent, structural_identifiability: "yes"}
        - {reaction_id: F_out, flux_type: exchange, value: 0.0, standard_deviation: 0.0, variable_type: constrained, structural_identifiability: "yes"}
      # simple_model.miso.sim Value column. Its Fragment is empty and its
      # Dataset is "MS_F_" (influx_si's own group name); measurement_id links it
      # to the measured group instead.
      simulated_mids:
        - measurement_id: MID_F_123
          metabolite_id: F
          data_points:
            - {isotopologue_index: 0, value: 6.34920635042151e-05}
            - {isotopologue_index: 1, value: 0.800761904914716}
            - {isotopologue_index: 2, value: 0.198285714323554}
            - {isotopologue_index: 3, value: 0.000888888889058518}
      # .miso.sim / .mflux.sim SD, Residual and Pvalue columns; measured_value
      # from .miso / .mflux. influx_si's "Residual" is (simulated - measured)/SD
      # (checked on every row: e.g. (0.800761904914716 - 0.800761905)/0.0227359334
      # = -3.751e-09), so it is stored as weighted_residual; the unweighted
      # residual is not reported by the tool and is left unset.
      measurement_fits:
        - {measurement_id: MID_F_123, isotopologue_index: 0, measured_value: 6.34920635e-05, simulated_value: 6.34920635042151e-05, standard_deviation: 8.34413657e-06, weighted_residual: 5.05161207007286e-10, p_value: 0.549191880847878}
        - {measurement_id: MID_F_123, isotopologue_index: 1, measured_value: 0.800761905, simulated_value: 0.800761904914716, standard_deviation: 0.0227359334, weighted_residual: -3.75106667415865e-09, p_value: 1.00654938636256e-45}
        - {measurement_id: MID_F_123, isotopologue_index: 2, measured_value: 0.198285714, simulated_value: 0.198285714323554, standard_deviation: 0.0226919962, weighted_residual: 1.4258493655366e-08, p_value: 0.0}
        - {measurement_id: MID_F_123, isotopologue_index: 3, measured_value: 0.000888888889, simulated_value: 0.000888888889058518, standard_deviation: 0.000118946889, weighted_residual: 4.91969944475501e-10, p_value: 0.58017731564555}
        - {measurement_id: FM_R1, measured_value: 100.0, simulated_value: 100.0, standard_deviation: 0.1, weighted_residual: 0.0, p_value: 0.247395414123624}
      # tmp/simple_model.pres.csv: the native group name; it is MID_F_123's
      # group (Specie F). The file gives no SD for it.
      scale_factors:
        - {measurement_id: "1:mass;F;111;108", value: 1.00000000019083}
    # simple_model.stat. number_of_parameters = 3 free fluxes + 1 scale factor
    # (.pres.csv). influx_si's p-value is the LOWER tail pchisq(chi2, df), and
    # its conclusion line ("At level of 95% confidence, the model fits the data
    # good enough ...") is the fit_accepted verdict.
    goodness_of_fit:
      wssr: 2.17872364785429e-16
      number_of_measurements: 5
      number_of_parameters: 4
      degrees_of_freedom: 1
      # influx_si's .stat p-value 1.17771751823129e-08 is the LOWER tail,
      # pchisq(chi2, df); the schema stores the upper tail, 1 - that.
      chi_square_p_value: 0.9999999882228248
      chi_square_confidence_level: 0.95
      fit_accepted: true
      reduced_chi_square: 2.17872364785429e-16
