# INVALID FluxoDataset — used for negative validation tests.
# Intentionally omits five fields that the schema still marks required:
#   - LabelingExperiment.stationary
#   - TracerIsotopomer.labeling_pattern
#   - MIDDataPoint.isotopologue_index
#   - SoftwareInfo.software_name
#   - FluxResult.value
# `linkml-validate` MUST reject this file.
#
# (Until 2026-10 this file omitted tracer_fraction, isotopic_purity and
# MIDDataPoint.standard_deviation. Those are now `recommended` in the schema
# and required only at the benchmark tier by `fluxolink-validate --benchmark`,
# so omitting them no longer fails linkml-validate.)
id: BAD_DS
name: Invalid dataset (missing required fields)

experiments:
  - id: EXP_BAD
    # MISSING: stationary (required)
    labeled_sources:
      - id: SRC_BAD
        metabolite_id: A
        tracers:
          - tracer_fraction: 1.0
            # MISSING: labeling_pattern (required)
    mid_measurements:
      - id: M_BAD
        metabolite_id: F
        data_points:
          - value: 0.5
            standard_deviation: 0.01
            # MISSING: isotopologue_index (required)

simulation_runs:
  - id: RUN_BAD
    software:
      id: SW_BAD
      # MISSING: software_name (required)
      version: "1.0"
    flux_solution:
      id: SOL_BAD
      flux_results:
        - reaction_id: R1
          flux_type: net
          # MISSING: value (required)
