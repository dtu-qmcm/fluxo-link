# WAY 1 of 2 for the FreeFlux corpus — "materialise the content".
#
# Source: fluxomics_data_converter/data/simple_model/roundtrip_test/freeflux_from_fml/
# (reactions.tsv, measured_MDVs.tsv, measured_fluxes.tsv, fluxes.tsv), plus the
# driver that ran FreeFlux on them: run_ff_forward() in
# simple_model/roundtrip_test/roundtrip_test.ipynb. The TSVs omit the tracer and
# every solver setting; the driver supplies them, so it is recorded as a
# SourceFile with role driver_script.
#
# This is the SAME eight-reaction network as simple_model_mtf_roundtrip.yaml, so
# the two files are a controlled comparison of what each format loses.
#
# Tally after the 2026-10 schema revision: 0 FABRICATED. Deleted: the Condition
# block, the analytical method, the software version and the placeholder
# contributor. The tracer and the optimizer, previously FABRICATED, are now
# grounded in the driver. No LOST markers remain; the dangling drain atoms are
# DERIVED (see E_out).
id: FLUXO_DS_simple_model_freeflux
name: simple_model — FreeFlux TSV set
description: >-
  Eight-reaction toy network as FreeFlux TSVs, converted from FluxML, and the
  FreeFlux fit attempted on it (which failed). Same model as the MTF encoding;
  differences below are format artefacts, not model changes.
schema_version: "0.1.0"
# Tier: catalog with materialised (Tier-2) content. This file records what
# the source states, and the source is not benchmark-complete: the FreeFlux version that produced the run is not recorded anywhere.
# `fluxolink-validate --benchmark` lists exactly what a benchmark would need.
dataset_type: catalog
fluxo_ontology_version: "2026-03-03"

source_files:
  # All four TSVs were written by the converter's write_freeflux() from the
  # no-NA FluxML (roundtrip_test.ipynb, conversion 4).
  - id: SF_reactions
    path: reactions.tsv
    format: freeflux_tsv
    role: [network]
    checksum: "sha256:55fb747317194287034c3f466c430ef9566003c0d572bc6d73779dab5da3c297"
    media_type: text/tab-separated-values
    file_size_bytes: 220
    generated_by: fluxomics_data_converter
  - id: SF_mdvs
    path: measured_MDVs.tsv
    format: freeflux_tsv
    role: [mid_measurements]
    checksum: "sha256:5422d81bfb37e2975d4608eadd15be7879ebc0cb1acff853ec094f5de22fec0f"
    file_size_bytes: 137
    generated_by: fluxomics_data_converter
  - id: SF_measured_fluxes
    path: measured_fluxes.tsv
    format: freeflux_tsv
    role: [flux_measurements]
    checksum: "sha256:5f497ff3fdb887865e42414c59dfd5d1b2b93a07d697d199d37fc536f0650257"
    file_size_bytes: 34
    generated_by: fluxomics_data_converter
  # fluxes.tsv is read twice by the driver: set_fluxes_from_file() and
  # solve(ini_fluxes=...), i.e. as the starting point of the fit.
  - id: SF_fluxes
    path: fluxes.tsv
    format: freeflux_tsv
    role: [variable_specification]
    checksum: "sha256:a33d1d2d190bbfdcae7dc3bbbe26878c0c4674d024831fa4126bc2d34f7847dd"
    file_size_bytes: 87
    generated_by: fluxomics_data_converter
  # The notebook builds the FreeFlux script as a string in run_ff_forward() and
  # runs it in a subprocess; its saved cell output is the run's only log.
  - id: SF_driver
    path: ../roundtrip_test.ipynb
    format: other
    format_other: Jupyter notebook (.ipynb)
    role: [driver_script, log]
    checksum: "sha256:f76a6ffdd4e87f1ece95891b202a64d6e7ea6e12b038c27db36490ced899eb56"
    file_size_bytes: 35586

investigations:
  - id: INV_simple_model
    name: simple_model FreeFlux round-trip

networks:
  - id: NET_simple_model_ff
    name: simple_model network (FreeFlux)
    metabolites:
      - {id: A, n_tracked_atoms: 3}
      - {id: B, n_tracked_atoms: 3}
      - {id: C, n_tracked_atoms: 2}
      - {id: D, n_tracked_atoms: 3}
      - {id: E, n_tracked_atoms: 1}
      - {id: F, n_tracked_atoms: 3}
    # NOTE vs the MTF encoding: FreeFlux declares NO external pools. The MTF
    # .netw had E_ext and F_ext; here E_out/F_out simply have an empty product
    # column. So the same model has 8 metabolites in MTF and 6 here. Nothing in
    # the schema records that these two networks are the same network.
    # Atom indices are 1-based positions in each letter string.
    reactions:
      # R1: A(abc) -> B(abc)
      - id: R1
        reversibility: false
        reactants: [{metabolite_id: A}]
        products: [{metabolite_id: B}]
        atom_transition_variants:
          - variant_id: R1_v1
            transitions:
              - {reactant_metabolite_id: A, reactant_atom_index: 1, product_metabolite_id: B, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: A, reactant_atom_index: 2, product_metabolite_id: B, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: A, reactant_atom_index: 3, product_metabolite_id: B, product_atom_index: 3, annotation_type: letter}
      # R2: B(abc) -> D(abc)
      - id: R2
        reversibility: false
        reactants: [{metabolite_id: B}]
        products: [{metabolite_id: D}]
        atom_transition_variants:
          - variant_id: R2_v1
            transitions:
              - {reactant_metabolite_id: B, reactant_atom_index: 1, product_metabolite_id: D, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 2, product_metabolite_id: D, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 3, product_metabolite_id: D, product_atom_index: 3, annotation_type: letter}
      # R3: D(abc) -> B(abc)
      - id: R3
        reversibility: false
        reactants: [{metabolite_id: D}]
        products: [{metabolite_id: B}]
        atom_transition_variants:
          - variant_id: R3_v1
            transitions:
              - {reactant_metabolite_id: D, reactant_atom_index: 1, product_metabolite_id: B, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: D, reactant_atom_index: 2, product_metabolite_id: B, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: D, reactant_atom_index: 3, product_metabolite_id: B, product_atom_index: 3, annotation_type: letter}
      # R4: B(abc) -> C(bc)+E(a).  Same mapping as the MTF file's
      # "B (cab) -> C (ab) + E (c)" but with different letters. The schema
      # normalises both to the same indices, which is a genuine win.
      - id: R4
        reversibility: false
        reactants: [{metabolite_id: B}]
        products: [{metabolite_id: C}, {metabolite_id: E}]
        atom_transition_variants:
          - variant_id: R4_v1
            transitions:
              - {reactant_metabolite_id: B, reactant_atom_index: 2, product_metabolite_id: C, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 3, product_metabolite_id: C, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 1, product_metabolite_id: E, product_atom_index: 1, annotation_type: letter}
      # R5: B(abc)+C(de) -> D(bcd)+E(a)+E(e).  E appears TWICE, as in the MTF
      # encoding; the two occurrences are participants with instance 1 and 2,
      # and each E transition names its occurrence.
      - id: R5
        reversibility: false
        reactants: [{metabolite_id: B}, {metabolite_id: C}]
        products:
          - {metabolite_id: D}
          - {metabolite_id: E, instance: 1}
          - {metabolite_id: E, instance: 2}
        atom_transition_variants:
          - variant_id: R5_v1
            transitions:
              - {reactant_metabolite_id: B, reactant_atom_index: 2, product_metabolite_id: D, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 3, product_metabolite_id: D, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: C, reactant_atom_index: 1, product_metabolite_id: D, product_atom_index: 3, annotation_type: letter}
              - {reactant_metabolite_id: B, reactant_atom_index: 1, product_metabolite_id: E, product_instance: 1, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: C, reactant_atom_index: 2, product_metabolite_id: E, product_instance: 2, product_atom_index: 1, annotation_type: letter}
      # R6: D(abc) -> F(abc)
      - id: R6
        reversibility: false
        reactants: [{metabolite_id: D}]
        products: [{metabolite_id: F}]
        atom_transition_variants:
          - variant_id: R6_v1
            transitions:
              - {reactant_metabolite_id: D, reactant_atom_index: 1, product_metabolite_id: F, product_atom_index: 1, annotation_type: letter}
              - {reactant_metabolite_id: D, reactant_atom_index: 2, product_metabolite_id: F, product_atom_index: 2, annotation_type: letter}
              - {reactant_metabolite_id: D, reactant_atom_index: 3, product_metabolite_id: F, product_atom_index: 3, annotation_type: letter}
      # E_out: "E_out | E | (empty) | 0" — a drain with no product.
      # DERIVED: FreeFlux writes no atom letters for a drain, but with no
      # product every tracked atom of the consumed pool leaves the system. The
      # dangling transitions (no product side) state exactly that.
      - id: E_out
        reversibility: false
        reaction_type: sink
        reactants: [{metabolite_id: E}]
        atom_transition_variants:
          - variant_id: E_out_v1
            transitions:
              - {reactant_metabolite_id: E, reactant_atom_index: 1}
      # F_out: "F_out | F | (empty) | 0" — DERIVED as for E_out.
      - id: F_out
        reversibility: false
        reaction_type: sink
        reactants: [{metabolite_id: F}]
        atom_transition_variants:
          - variant_id: F_out_v1
            transitions:
              - {reactant_metabolite_id: F, reactant_atom_index: 1}
              - {reactant_metabolite_id: F, reactant_atom_index: 2}
              - {reactant_metabolite_id: F, reactant_atom_index: 3}

experiments:
  - id: EXP_simple_model_ff
    name: simple_model FreeFlux experiment
    investigation_id: INV_simple_model
    network_model_id: NET_simple_model_ff
    # cmfa exact MID (no noise, no natural abundance): a forward-simulated
    # benchmark, so there is no cultivation Condition.
    data_origin: simulated
    # m.fitter("ss") in the driver: steady state.
    stationary: true
    source_files: [SF_mdvs, SF_measured_fluxes, SF_driver]
    labeled_sources:
      # NOT in the TSVs: FreeFlux sets the tracer through its Python API. From
      # the driver: fit.set_labeling_strategy("A", labeling_pattern=["010"],
      # percentage=[1], purity=[1]).
      - id: SRC_A
        metabolite_id: A
        input_type: isotopomer
        tracers:
          - labeling_pattern: "010"
            tracer_fraction: 1.0
            isotopic_purity: 1.0
    mid_measurements:
      # measured_MDVs.tsv: "F_123 | <4 comma-joined means> | <4 comma-joined sds>"
      # The fragment id F_123 is split on the last underscore into metabolite F
      # and positions 1,2,3. FreeFlux records no analytical method.
      - id: MID_F_123
        metabolite_id: F
        fragment_name: F_123
        atom_positions: "1,2,3"
        data_points:
          - {isotopologue_index: 0, value: 6.34920635e-05, standard_deviation: 8.34413657e-06}
          - {isotopologue_index: 1, value: 0.800761905, standard_deviation: 0.0227359334}
          - {isotopologue_index: 2, value: 0.198285714, standard_deviation: 0.0226919962}
          - {isotopologue_index: 3, value: 0.000888888889, standard_deviation: 0.000118946889}
    flux_measurements:
      # measured_fluxes.tsv: "R1 | 100.0 | 0.1"
      - id: FM_R1
        reaction_id: R1
        flux_type: net
        value: 100.0
        standard_deviation: 0.1

simulation_runs:
  - id: RUN_freeflux
    investigation_id: INV_simple_model
    network_model_id: NET_simple_model_ff
    experiment_id: [EXP_simple_model_ff]
    fluxomics_method: IST_MFA
    # The notebook labels this section "forward simulation", but the driver
    # calls fit.solve() because Fitter.simulate() has an MRO bug — what ran was
    # an estimation.
    run_mode: [estimation]
    # The saved cell output ("[FF-from-FML]") is a traceback out of solve():
    # the converted files list E_out/F_out as explicit drains, which this
    # FreeFlux version does not expect.
    run_status: failed
    solver_status: "ValueError: cannot set using a slice indexer with a different length than the value"
    software:
      id: SW_freeflux
      software_name: freeflux
    input_format: freeflux_tsv
    # From the driver: fit.solve(solver="slsqp", ...).
    optimization_method: slsqp
    solver_options:
      - {key: fitter, value: ss, description: "m.fitter('ss')"}
      - {key: set_fluxes_from_file, value: fluxes.tsv}
      - {key: n_jobs, value: "1", description: "fit.prepare(n_jobs=1)"}
      - {key: solver, value: slsqp, description: "fit.solve() argument"}
      - {key: ini_fluxes, value: fluxes.tsv, description: "fit.solve() argument"}
    # No output_files: FreeFlux wrote nothing; the traceback survives only in
    # the driver notebook's saved output (SF_driver, role log).
    input_files: [SF_reactions, SF_mdvs, SF_measured_fluxes, SF_fluxes, SF_driver]
    # fluxes.tsv, passed as ini_fluxes: starting net fluxes. FreeFlux does not
    # classify them as free/dependent, so variable_type is absent.
    variables:
      - {variable_id: E_out, variable_kind: net_flux, value: 60.0}
      - {variable_id: F_out, variable_kind: net_flux, value: 80.0}
      - {variable_id: R1, variable_kind: net_flux, value: 100.0}
      - {variable_id: R2, variable_kind: net_flux, value: 110.0}
      - {variable_id: R3, variable_kind: net_flux, value: 50.0}
      - {variable_id: R4, variable_kind: net_flux, value: 20.0}
      - {variable_id: R5, variable_kind: net_flux, value: 20.0}
      - {variable_id: R6, variable_kind: net_flux, value: 80.0}
    # No flux_solution and no goodness_of_fit: the run failed before producing
    # any result.
