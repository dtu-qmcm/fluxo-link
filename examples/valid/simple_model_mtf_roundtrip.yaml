    file_size_bytes: 278

conditions:
  - # FABRICATED (whole block): MTF carries no investigation metadata at all.
    id: COND_unknown
    organism_name: unknown
    strain: unknown
    specific_growth_rate: 0.0
    growth_rate_unit: 1/h

investigations:
  - id: INV_simple_model
    name: simple_model MTF round-trip
    description: >-
      Synthetic eight-reaction network used to verify converter round-trips
      across FluxML, MTF and FreeFlux.
    contributors:
      # FABRICATED: no native MTF file records a contributor.
      - id: CONTRIB_unknown
        name: Unknown

networks:
  - id: NET_simple_model
    name: simple_model network
    metabolites:
      - id: A
        n_tracked_atoms: 3
      - id: B
        n_tracked_atoms: 3
      - id: C
        n_tracked_atoms: 2
      - id: D
        n_tracked_atoms: 3
      - id: E
        n_tracked_atoms: 1
      - id: F
        n_tracked_atoms: 3
      # LOST: no is_external slot. E_ext / F_ext are boundary pools, marked
      # only by the _ext suffix convention in the .netw file.
      - id: E_ext
        n_tracked_atoms: 1
      - id: F_ext
        n_tracked_atoms: 3
    reactions:
      # LOST for every reaction below: the source arrow is "->>" (reversible in
      # mechanism, net >= 0). A boolean cannot distinguish "->>" from "->", and
      # "->>" is what generates the .cnstr.def NET >= 0 rows.
      - id: R1
        reversibility: false
        reactants:
          - metabolite_id: A
        products:
          - metabolite_id: B
        atom_transition_variants:
          - variant_id: R1_v1
            transitions:
              - reactant_metabolite_id: A
                reactant_atom_index: 0
                product_metabolite_id: B
                product_atom_index: 0
                annotation_type: letter
              - reactant_metabolite_id: A
                reactant_atom_index: 1
                product_metabolite_id: B
                product_atom_index: 1
                annotation_type: letter
              - reactant_metabolite_id: A
                reactant_atom_index: 2
                product_metabolite_id: B
                product_atom_index: 2
                annotation_type: letter
      - id: R2
        reversibility: false
        reactants:
          - metabolite_id: B
        products:
          - metabolite_id: D
        atom_transition_variants:
          - variant_id: R2_v1
            transitions:
              - reactant_metabolite_id: B
                reactant_atom_index: 0
                product_metabolite_id: D
                product_atom_index: 0
                annotation_type: letter
              - reactant_metabolite_id: B
                reactant_atom_index: 1
                product_metabolite_id: D
                product_atom_index: 1
                annotation_type: letter
              - reactant_metabolite_id: B
                reactant_atom_index: 2
                product_metabolite_id: D
                product_atom_index: 2
                annotation_type: letter
      - id: R3
        reversibility: false
        reactants:
          - metabolite_id: D
        products:
          - metabolite_id: B
        atom_transition_variants:
          - variant_id: R3_v1
            transitions:
              - reactant_metabolite_id: D
                reactant_atom_index: 0
                product_metabolite_id: B
                product_atom_index: 0
                annotation_type: letter
              - reactant_metabolite_id: D
                reactant_atom_index: 1
                product_metabolite_id: B
                product_atom_index: 1
                annotation_type: letter
              - reactant_metabolite_id: D
                reactant_atom_index: 2
                product_metabolite_id: B
                product_atom_index: 2
                annotation_type: letter
      # R4: B (cab) ->> C (ab) + E (c)
      - id: R4
        reversibility: false
        reactants:
          - metabolite_id: B
        products:
          - metabolite_id: C
          - metabolite_id: E
        atom_transition_variants:
          - variant_id: R4_v1
            transitions:
              - reactant_metabolite_id: B
                reactant_atom_index: 1
                product_metabolite_id: C
                product_atom_index: 0
                annotation_type: letter
              - reactant_metabolite_id: B
                reactant_atom_index: 2
                product_metabolite_id: C
                product_atom_index: 1
                annotation_type: letter
              - reactant_metabolite_id: B
                reactant_atom_index: 0
                product_metabolite_id: E
                product_atom_index: 0
                annotation_type: letter
      # R5: B (dab) + C (ce) ->> D (abc) + E (d) + E (e)
      # E appears TWICE as a product, receiving different source atoms.
      - id: R5
        reversibility: false
        reactants:
          - metabolite_id: B
          - metabolite_id: C
        products:
          - metabolite_id: D
          - metabolite_id: E
          - metabolite_id: E
        atom_transition_variants:
          - variant_id: R5_v1
            transitions:
              - reactant_metabolite_id: B
                reactant_atom_index: 1
                product_metabolite_id: D
                product_atom_index: 0
                annotation_type: letter
              - reactant_metabolite_id: B
                reactant_atom_index: 2
                product_metabolite_id: D
                product_atom_index: 1
                annotation_type: letter
              - reactant_metabolite_id: C
                reactant_atom_index: 0
                product_metabolite_id: D
                product_atom_index: 2
                annotation_type: letter
              # LOST: the next two rows are the two distinct E occurrences.
              # Both resolve to (product_metabolite_id: E, product_atom_index: 0)
              # so the pair is indistinguishable — there is no occurrence index
              # on ReactionParticipant or AtomTransition.
              - reactant_metabolite_id: B
                reactant_atom_index: 0
                product_metabolite_id: E
                product_atom_index: 0
                annotation_type: letter
              - reactant_metabolite_id: C
                reactant_atom_index: 1
                product_metabolite_id: E
                product_atom_index: 0
                annotation_type: letter
      - id: R6
        reversibility: false
        reactants:
          - metabolite_id: D
        products:
          - metabolite_id: F
        atom_transition_variants:
          - variant_id: R6_v1
            transitions:
              - reactant_metabolite_id: D
                reactant_atom_index: 0
                product_metabolite_id: F
                product_atom_index: 0
                annotation_type: letter
              - reactant_metabolite_id: D
                reactant_atom_index: 1
                product_metabolite_id: F
                product_atom_index: 1
                annotation_type: letter
              - reactant_metabolite_id: D
                reactant_atom_index: 2
                product_metabolite_id: F
                product_atom_index: 2
                annotation_type: letter
      - id: E_out
        reversibility: false
        reaction_type: exchange
        reactants:
          - metabolite_id: E
        products:
          - metabolite_id: E_ext
        atom_transition_variants:
          - variant_id: E_out_v1
            transitions:
              - reactant_metabolite_id: E
                reactant_atom_index: 0
                product_metabolite_id: E_ext
                product_atom_index: 0
                annotation_type: letter
      - id: F_out
        reversibility: false
        reaction_type: exchange
        reactants:
          - metabolite_id: F
        products:
          - metabolite_id: F_ext
        atom_transition_variants:
          - variant_id: F_out_v1
            transitions:
              - reactant_metabolite_id: F
                reactant_atom_index: 0
                product_metabolite_id: F_ext
                product_atom_index: 0
                annotation_type: letter
              - reactant_metabolite_id: F
                reactant_atom_index: 1
                product_metabolite_id: F_ext
                product_atom_index: 1
                annotation_type: letter
              - reactant_metabolite_id: F
                reactant_atom_index: 2
                product_metabolite_id: F_ext
                product_atom_index: 2
                annotation_type: letter
    # The 16 .cnstr rows collapse to 8 bound constraints (a >= / <= pair each).
    # LOST for every row: Kind=NET. There is no constraint-domain slot, so a
    # NET-scoped and an XCH-scoped bound on the same reaction are identical here.
    flux_constraints:
      - {id: CNSTR_R1, reaction_id: R1, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_R2, reaction_id: R2, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_R3, reaction_id: R3, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_R4, reaction_id: R4, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_R5, reaction_id: R5, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_R6, reaction_id: R6, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_E_out, reaction_id: E_out, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: CNSTR_F_out, reaction_id: F_out, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}

experiments:
  - id: EXP_simple_model
    name: simple_model stationary labeling
    investigation_id: INV_simple_model
    # LOST: no network_model_id slot, so the metabolite_id / reaction_id foreign
    # keys below do not declare which network they resolve against.
    stationary: true
    condition: COND_unknown
    tracer_summary: 100% [2-13C] A
    labeled_sources:
      - id: SRC_A
        metabolite_id: A
        input_type: isotopomer
        tracers:
          - labeling_pattern: "010"
            tracer_fraction: 1.0
            # FABRICATED: .linp has no purity column.
            isotopic_purity: 1.0
    mid_measurements:
      - id: MID_F_123
        metabolite_id: F
        atom_positions: "1,2,3"
        # FABRICATED: .miso carries no analytical method. Dataset="F_123".
        analytical_method: other
        analytical_method_other: not recorded in MTF
        dataset_id: F_123
        data_points:
          - {isotopologue_index: 0, value: 6.34920635e-05, standard_deviation: 8.34413657e-06}
          - {isotopologue_index: 1, value: 0.800761905, standard_deviation: 0.0227359334}
          - {isotopologue_index: 2, value: 0.198285714, standard_deviation: 0.0226919962}
          - {isotopologue_index: 3, value: 0.000888888889, standard_deviation: 0.000118946889}
    flux_measurements:
      # LOST: .mflux has no Kind column; flux_type=net is a convention, not data.
      # LOST: .mflux has no unit column, so flux_unit is unset.
      - id: FM_R1
        reaction_id: R1
        flux_type: net
        value: 100.0
        standard_deviation: 0.1

simulation_runs:
  - id: RUN_influx_si
    investigation_id: INV_simple_model
    network_model_id: NET_simple_model
    experiment_id:
      - EXP_simple_model
    fluxomics_method: IST_MFA
    software:
      id: SW_influx_si
      software_name: influx_si
      # From the .cnstr.def / .tvar.def comment preambles, not from any input file.
      version: "7.4.3"
    input_format: MTF
    # FABRICATED: no MTF file records an optimizer. The .log shows --noopt,
    # i.e. this run did not optimise at all, so the slot is not merely absent
    # but inapplicable. influx_si's default would be "nlsic".
    optimization_method: nlsic
    isotopic_state_space: cumomer
    input_files:
      - id: SF_netw_ref
        path: simple_model.netw
        format: MTF
        role: network
      - id: SF_linp_ref
        path: simple_model.linp
        format: MTF
        role: tracer
      - id: SF_miso_ref
        path: simple_model.miso
        format: MTF
        role: measurements
      - id: SF_mflux_ref
        path: simple_model.mflux
        format: MTF
        role: measurements
      - id: SF_cnstr_ref
        path: simple_model.cnstr
        format: MTF
        role: constraints
      - id: SF_tvar_ref
        path: simple_model.tvar
        format: MTF
        role: simulation
      - id: SF_opt_ref
        path: simple_model.opt
        format: MTF
        role: configuration
    output_files:
      - id: SF_tvar_sim_ref
        path: simple_model_res/simple_model.tvar.sim
        format: MTF
        role: results
      - id: SF_miso_sim_ref
        path: simple_model_res/simple_model.miso.sim
        format: MTF
        role: results
      - id: SF_mflux_sim_ref
        path: simple_model_res/simple_model.mflux.sim
        format: MTF
        role: results
      - id: SF_stat_ref
        path: simple_model_res/simple_model.stat
        format: MTF
        role: results
    # From simple_model.tvar (the INPUT variable file).
    # LOST: the Type column (F=free for R1/R2/R3, D=dependent for the rest).
    # There is no free/dependent/constrained slot anywhere in the schema, so
    # this file is indistinguishable from a fitted solution.
    initial_values:
      id: INIT_influx_si
      flux_results:
        - {reaction_id: R1, flux_type: net, value: 100.0}
        - {reaction_id: R2, flux_type: net, value: 110.0}
        - {reaction_id: R3, flux_type: net, value: 50.0}
        - {reaction_id: R4, flux_type: net, value: 15.593220338983064}
        - {reaction_id: R5, flux_type: net, value: 1.0169491525423675}
        - {reaction_id: R6, flux_type: net, value: 40.67796610169487}
        - {reaction_id: E_out, flux_type: net, value: 8.813559322033901}
        - {reaction_id: F_out, flux_type: net, value: 20.338983050847435}
    # From simple_model.tvar.sim (the FITTED solution).
    # LOST per row: Type (F/C/D) and Struct_identif (yes/no).
    flux_solution:
      id: SOL_influx_si
      flux_results:
        - {reaction_id: R1, flux_type: net, value: 100.0, standard_deviation: 0.0999999999999999}
        - {reaction_id: R1, flux_type: exchange, value: 0.0, standard_deviation: 0.0}
        - {reaction_id: R2, flux_type: net, value: 110.0, standard_deviation: 12.6867790062193}
        - {reaction_id: R2, flux_type: exchange, value: 0.0, standard_deviation: 0.0}
        - {reaction_id: R3, flux_type: net, value: 50.0, standard_deviation: 10.2318802202028}
        - {reaction_id: R3, flux_type: exchange, value: 0.0, standard_deviation: 0.0}
        - {reaction_id: R4, flux_type: net, value: 20.0, standard_deviation: 1.30753659221237}
        - {reaction_id: R4, flux_type: exchange, value: 0.0, standard_deviation: 0.0}
        - {reaction_id: R5, flux_type: net, value: 20.0, standard_deviation: 1.30753659221237}
        - {reaction_id: R5, flux_type: exchange, value: 0.0, standard_deviation: 0.0}
        - {reaction_id: R6, flux_type: net, value: 80.0, standard_deviation: 1.30982897355889}
        - {reaction_id: R6, flux_type: exchange, value: 0.0, standard_deviation: 0.0}
        - {reaction_id: E_out, flux_type: net, value: 60.0, standard_deviation: 3.92260977663711}
        - {reaction_id: E_out, flux_type: exchange, value: 0.0, standard_deviation: 0.0}
        - {reaction_id: F_out, flux_type: net, value: 80.0, standard_deviation: 1.30982897355889}
        - {reaction_id: F_out, flux_type: exchange, value: 0.0, standard_deviation: 0.0}
      # From simple_model.miso.sim.
      # LOST per data point: Residual and Pvalue.
      # FABRICATED: analytical_method and atom_positions are required on
      # MIDMeasurement, and .miso.sim leaves Fragment empty (= whole molecule).
      # The SD column here is the *measurement* SD echoed back, not a property
      # of the simulated value.
      simulated_mids:
        - id: SIMMID_F
          metabolite_id: F
          atom_positions: "1,2,3"
          analytical_method: other
          analytical_method_other: simulated value, not measured
          dataset_id: MS_F_
          data_points:
            - {isotopologue_index: 0, value: 6.34920635042151e-05, standard_deviation: 8.34413657e-06}
            - {isotopologue_index: 1, value: 0.800761904914716, standard_deviation: 0.0227359334}
            - {isotopologue_index: 2, value: 0.198285714323554, standard_deviation: 0.0226919962}
            - {isotopologue_index: 3, value: 0.000888888889058518, standard_deviation: 0.000118946889}
    # From simple_model.stat.
    # LOST: number_of_measurements (5), number_of_parameters (4), and the
    # conclusion sentence. Note p-value here is influx_si's LOWER tail.
    goodness_of_fit:
      wssr: 2.17872364785429e-16
      degrees_of_freedom: 1
      chi_square_p_value: 1.17771751823129e-08
      reduced_chi_square: 2.17872364785429e-16
