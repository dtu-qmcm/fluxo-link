# INVALID FluxoDataset — used for negative validation tests.
#
# This document declares `dataset_type: benchmark`, which asserts that it
# carries Tier-2 input ground truth, but supplies no `networks` — the
# materialised network a benchmark is measured against. It is otherwise
# well-formed: the same content at `dataset_type: catalog` is valid (see
# examples/valid/simple_model_mtf_catalog.yaml).
#
# The FluxoDataset rule `benchmark_tier_requires_input_ground_truth` MUST
# reject it, naming `networks`. This is the negative half of the tier fix:
# relaxing SimulationRun.network_model_id to `recommended` must not silently
# make the materialised network optional for benchmark datasets too.
# (`experiments` is deliberately NOT required by the rule — a stoichiometry-
# based run has no tracer — so its absence here is not what fails.)
id: BAD_DS_benchmark_no_inputs
name: Invalid dataset (benchmark tier without input ground truth)
schema_version: "0.1.0"
dataset_type: benchmark

source_files:
  - id: SF_netw
    path: simple_model.netw
    format: MTF
    role: [network]

investigations:
  - id: INV_simple_model
    name: simple_model MTF round-trip

# No `networks` and no `experiments` — legal at the catalog tier; the missing
# `networks` is a rule violation at the benchmark tier.

simulation_runs:
  - id: RUN_influx_si
    investigation_id: INV_simple_model
    fluxomics_method: IST_MFA
    run_mode: [forward_simulation]
    software:
      id: SW_influx_si
      software_name: influx_si
      version: "7.4.3"
    input_format: MTF
    input_files: [SF_netw]
