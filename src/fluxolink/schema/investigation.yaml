id: https://w3id.org/fluxolink/investigation
name: fluxolink-investigation
title: FLUXO Investigation Module
description: >-
  Investigation-level provenance classes for fluxomics investigations,
  including contributors and publication metadata. Cultivation
  conditions live in the experiment module.

license: Apache-2.0

prefixes:
  linkml: https://w3id.org/linkml/
  fluxo: http://purl.obolibrary.org/obo/
  schema: http://schema.org/

default_prefix: fluxo
default_range: string

imports:
  - linkml:types
  - enumerations

classes:
  Investigation:
    class_uri: fluxo:FLUXO_0000162
    description: >-
      A fluxomics investigation comprising one or more isotope labeling
      experiments or simulation studies.
    attributes:
      id:
        in_subset: [core]
        description: Unique identifier for the investigation.
        identifier: true
        required: true
      name:
        in_subset: [core]
        description: Human-readable name of the investigation.
        required: true
      description:
        description: Detailed description of the investigation.
      publication_doi:
        in_subset: [core]
        description: DOI of the associated publication.
        range: uriorcurie
      investigation_type:
        in_subset: [core]
        description: >-
          Kind of fluxomics investigation this is (FLUXO:0000162
          subtree). Distinct from SimulationRun.fluxomics_method: the
          investigation is the executed process, the method is the plan
          each run realises, and one investigation may realise several.
        range: InvestigationTypeEnum
      contributors:
        description: List of contributors to this investigation.
        range: Contributor
        multivalued: true
        inlined_as_list: true

  Contributor:
    class_uri: fluxo:FLUXO_0000253
    description: >-
      A person who contributed to a fluxomics investigation.
    attributes:
      id:
        description: Unique identifier for the contributor.
        identifier: true
        required: true
      name:
        description: Full name of the contributor.
        slot_uri: fluxo:FLUXO_0000255
        required: true
      orcid:
        description: ORCID identifier of the contributor.
        slot_uri: fluxo:FLUXO_0000256
        range: uriorcurie
      email:
        description: Email address of the contributor.
        slot_uri: fluxo:FLUXO_0000257
      organization:
        description: Affiliated organization.
        slot_uri: fluxo:FLUXO_0000258
