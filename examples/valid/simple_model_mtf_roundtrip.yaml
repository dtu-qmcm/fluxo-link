# Round-trip of the influx_si MTF corpus at
#   fluxomics_data_converter/data/simple_model/roundtrip_test/MTF_from_mtf/
# encoded by hand as a FluxoDataset, to test whether the schema can hold the
# whole dataset. Inputs (.netw .linp .miso .mflux .cnstr .tvar .opt), the two
# files txt2ftbl generates during the run (.cnstr.def .tvar.def), and solver
# output (.tvar.sim .miso.sim .mflux.sim .stat .log .err, tmp/.pres.csv,
# tmp/.R).
#
# Values marked "FABRICATED" appear nowhere in the source data but are forced by
# a required slot. Comments marked "LOST" record source information that has no
# slot. See PATH_FORWARD.md §13 / IMPLEMENTATION_PLAN.md Phase 3t.
#
# Tally after the 2026-10 schema revision: 0 FABRICATED (the condition block,
# contributor, tracer purity, analytical methods, simulated-MID atom positions
# and optimizer were all deleted once their slots stopped being required).
# LOST remaining: the "->>" arrow (below), the .mflux Kind convention, and the
# .log "calcul" timestamp.
#
# The data are a noise-free forward simulation: the MID is the "cmfa exact" MID
# and the fluxes are the cmfa ground truth (roundtrip_test.ipynb TRUE_FLUXES /
# CMFA_EXACT), hence data_origin: simulated and no Condition.
id: FLUXO_DS_simple_model_mtf
name: simple_model — influx_si MTF round-trip
description: >-
  Eight-reaction toy network forward-simulated by influx_si 7.4.3 (--noopt).
  Encoded from the MTF input set and its solver output to exercise schema
  coverage.
schema_version: "0.1.0"
# Tier: catalog with materialised (Tier-2) content. This file records what
# the source states, and the source is not benchmark-complete: the .linp states no tracer purity.
# `fluxolink-validate --benchmark` lists exactly what a benchmark would need.
dataset_type: catalog
fluxo_ontology_version: "2026-03-03"

