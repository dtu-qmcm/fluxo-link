# Valid FluxoDataset — faithful representation of the `simple_model`
# benchmark (fluxomics_data_converter/data/simple_model), which exists in
# FluxML, MTF, and FreeFlux forms. Demonstrates a 13C-MFA run and, on the
# same network, an FBA run (Phase 3k multi-method scenario).
#
# ILLUSTRATIVE metadata: this network is a synthetic toy, so it has no organism,
# strain or growth rate; the conditions carry only an id and a name. Software
# versions and optimizer names are examples, not read from a recorded run.
id: FLUXO_DS_simple_model
name: Simple model demonstration dataset
description: >-
  Six-metabolite toy network (A -> B <-> D -> F, with a B -> C + E split)
  converted from the FreeFlux/FluxML simple_model, plus a parallel FBA run.
schema_version: "0.1.0"
fluxo_ontology_version: "2026-03-03"

conditions:
  - id: COND1
    name: Toy-model labeling condition (synthetic; no organism)
  - id: COND_FBA
    name: Toy-model FBA condition (synthetic; no organism)

investigations:
  - id: INV1
    name: Simple model flux investigation
    description: Estimation of intracellular fluxes in the toy network.
    investigation_type: MFA
    contributors:
      - id: C1
        name: Jane Doe
        orcid: ORCID:0000-0002-1825-0097
        organization: DTU Biosustain

networks:
  - id: NET1
    name: Simple model network
    compartments:
      - c
    metabolites:
      - {id: A, name: substrate A, compartment: c, n_tracked_atoms: 3}
      - {id: B, name: intermediate B, compartment: c, n_tracked_atoms: 3}
      - {id: C, name: intermediate C, compartment: c, n_tracked_atoms: 2}
      - {id: D, name: intermediate D, compartment: c, n_tracked_atoms: 3}
      - {id: E, name: byproduct E, compartment: c, n_tracked_atoms: 1}
      - {id: F, name: product F, compartment: c, n_tracked_atoms: 3}
    reactions:
      - id: R1
        name: A to B
        reversibility: false
        reaction_type: metabolic
        reactants:
          - {metabolite_id: A}
        products:
          - {metabolite_id: B}
        atom_transition_variants:
          - variant_id: R1___1
            transitions:
              - {reactant_metabolite_id: A, reactant_atom_index: 1, product_metabolite_id: B, product_atom_index: 1}
              - {reactant_metabolite_id: A, reactant_atom_index: 2, product_metabolite_id: B, product_atom_index: 2}
              - {reactant_metabolite_id: A, reactant_atom_index: 3, product_metabolite_id: B, product_atom_index: 3}
      - id: R2
        name: B to D
        reversibility: false
        reaction_type: metabolic
        reactants:
          - {metabolite_id: B}
        products:
          - {metabolite_id: D}
      - id: R3
        name: D to B
        reversibility: false
        reaction_type: metabolic
        reactants:
          - {metabolite_id: D}
        products:
          - {metabolite_id: B}
      - id: R4
        name: B to C plus E
        reversibility: false
        reaction_type: metabolic
        reactants:
          - {metabolite_id: B}
        products:
          - {metabolite_id: C}
          - {metabolite_id: E}
        atom_transition_variants:
          - variant_id: R4___1
            transitions:
              - {reactant_metabolite_id: B, reactant_atom_index: 2, product_metabolite_id: C, product_atom_index: 1}
              - {reactant_metabolite_id: B, reactant_atom_index: 3, product_metabolite_id: C, product_atom_index: 2}
              - {reactant_metabolite_id: B, reactant_atom_index: 1, product_metabolite_id: E, product_atom_index: 1}
      # Atom transitions for R2/R3/R5/R6 omitted for brevity (recommended, not required).
      - id: R5
        name: B plus C to D plus E
        reversibility: false
        reaction_type: metabolic
        reactants:
          - {metabolite_id: B}
          - {metabolite_id: C}
        products:
          - {metabolite_id: D}
          - {metabolite_id: E}
      - id: R6
        name: D to F
        reversibility: false
        reaction_type: metabolic
        reactants:
          - {metabolite_id: D}
        products:
          - {metabolite_id: F}
      - id: E_out
        name: E efflux
        reversibility: false
        reaction_type: sink
        reactants:
          - {metabolite_id: E}
        # sink reaction: no products (allowed — products is recommended, not required)
      - id: F_out
        name: F efflux
        reversibility: false
        reaction_type: sink
        reactants:
          - {metabolite_id: F}
    flux_constraints:
      - {id: c_R1, reaction_id: R1, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: c_R6, reaction_id: R6, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}
      - {id: c_Fout, reaction_id: F_out, constraint_type: bound, lower_bound: 0.0, upper_bound: 150.0}

experiments:
  - id: EXP1
    name: Simple model labeling experiment
    investigation_id: INV1
    data_origin: synthetic
    stationary: true
    condition: COND1
    labeled_sources:
      - id: SRC1
        metabolite_id: A
        input_type: isotopomer
        tracers:
          - labeling_pattern: "010"
            tracer_fraction: 1.0
            isotopic_purity: 1.0
    mid_measurements:
      - id: M_F
        metabolite_id: F
        atom_positions: "1,2,3"
        analytical_method: GC_MS
        scale_method: auto
        natural_abundance_corrected: true
        correction_algorithm: IsoCor
        data_points:
          - {isotopologue_index: 0, value: 6.14943422e-05, standard_deviation: 8.08159573e-06}
          - {isotopologue_index: 1, value: 7.83877703e-01, standard_deviation: 2.22564862e-02}
          - {isotopologue_index: 2, value: 2.12980112e-01, standard_deviation: 2.24565253e-02}
          - {isotopologue_index: 3, value: 3.08069114e-03, standard_deviation: 2.68350613e-04}
    flux_measurements:
      - id: FM_R1
        reaction_id: R1
        flux_type: net
        value: 100.0
        standard_deviation: 0.1
        flux_unit: mmol/gDW/h

simulation_runs:
  - id: RUN_MFA
    investigation_id: INV1
    network_model_id: NET1
    experiment_id:
      - EXP1
    fluxomics_method: I_MFA
    software:
      id: SW1
      software_name: freeflux
      version: "0.3.4"
    input_format: FluxML
    optimization_method: least_squares
    run_mode: [estimation]
    flux_solution:
      id: SOL_MFA
      flux_results:
        - {reaction_id: R1, flux_type: net, value: 100.0, flux_unit: mmol/gDW/h}
        - {reaction_id: R2, flux_type: net, value: 110.0, flux_unit: mmol/gDW/h}
        - {reaction_id: R3, flux_type: net, value: 50.0, flux_unit: mmol/gDW/h}
        - {reaction_id: R4, flux_type: net, value: 20.0, flux_unit: mmol/gDW/h}
        - {reaction_id: R5, flux_type: net, value: 20.0, flux_unit: mmol/gDW/h}
        - {reaction_id: R6, flux_type: net, value: 80.0, flux_unit: mmol/gDW/h}
        - {reaction_id: E_out, flux_type: net, value: 60.0, flux_unit: mmol/gDW/h}
        - {reaction_id: F_out, flux_type: net, value: 80.0, flux_unit: mmol/gDW/h}
    goodness_of_fit:
      wssr: 3.9
      degrees_of_freedom: 3
      chi_square_p_value: 0.27
      reduced_chi_square: 1.3
  - id: RUN_FBA
    investigation_id: INV1
    network_model_id: NET1
    fluxomics_method: constraint_based
    condition: COND_FBA
    software:
      id: SW2
      software_name: other
      software_name_other: COBRApy
      version: "0.29.0"
    optimization_method: simplex
    objective_function: maximize v(F_out)
    flux_solution:
      id: SOL_FBA
      flux_results:
        - {reaction_id: F_out, flux_type: net, value: 100.0, flux_unit: mmol/gDW/h}
