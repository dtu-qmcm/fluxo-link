id: https://w3id.org/fluxolink/network
name: fluxolink-network
title: FLUXO Network Module
description: >-
  Metabolic network model classes including metabolites, reactions,
  atom transitions, and flux constraints.

license: Apache-2.0

prefixes:
  linkml: https://w3id.org/linkml/
  fluxo: http://purl.obolibrary.org/obo/

default_prefix: fluxo
default_range: string

imports:
  - linkml:types
  - enumerations

classes:
  MetabolicNetworkModel:
    class_uri: fluxo:FLUXO_0000127
    description: >-
      A computational representation of a metabolic network, including
      metabolites, reactions, compartments, and atom transitions.
    attributes:
      id:
        description: Unique identifier for the network model.
        identifier: true
        required: true
      name:
        description: Human-readable name of the network model.
      compartments:
        description: List of compartment names in the model.
        slot_uri: fluxo:FLUXO_0000058
        multivalued: true
      metabolites:
        description: Metabolite definitions in the network.
        range: NetworkMetabolite
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
      reactions:
        description: Reaction definitions in the network.
        range: NetworkReaction
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
      flux_constraints:
        description: >-
          Constraints on reaction flux values (bounds, equalities,
          linear-combination constraints).
        range: FluxConstraint
        multivalued: true
        inlined_as_list: true
      pool_size_constraints:
        description: >-
          Constraints on metabolite pool size values.
        range: PoolSizeConstraint
        multivalued: true
        inlined_as_list: true

  NetworkMetabolite:
    class_uri: fluxo:FLUXO_0000172
    description: >-
      A metabolite in a metabolic network model.
    attributes:
      id:
        description: Unique metabolite identifier (e.g., G6P_c).
        identifier: true
        required: true
      name:
        description: Human-readable metabolite name.
      formula:
        description: Chemical formula of the metabolite.
        slot_uri: fluxo:FLUXO_0000199
      charge:
        description: Metabolite's molecular charge.
        slot_uri: fluxo:FLUXO_0000200
        range: integer
      compartment:
        description: Compartment where the metabolite resides.
        slot_uri: fluxo:FLUXO_0000058
      n_tracked_atoms:
        description: >-
          Number of atoms of the tracer element in this metabolite
          (e.g., 6 for carbons in glucose).
        slot_uri: fluxo:FLUXO_0000183
        range: integer
        minimum_value: 0
      inchi:
        description: InChI identifier for the metabolite.
        slot_uri: fluxo:FLUXO_0000239
      smiles:
        description: SMILES representation of the metabolite.
        slot_uri: fluxo:FLUXO_0000240
      is_pseudo:
        description: >-
          Whether this is a pseudo-metabolite (e.g., biomass) with no
          biological counterpart.
        slot_uri: fluxo:FLUXO_0000061
        range: boolean
        ifabsent: "false"
      aliases:
        description: >-
          Tool-namespaced alternative identifiers (e.g.,
          "influx_si:v5", "freeflux:R1"). The canonical↔native ID
          mapping is new information present in no native file — it
          lives in the dataset, once per entity.

  NetworkReaction:
    class_uri: fluxo:FLUXO_0000005
    description: >-
      A biochemical reaction in a metabolic network model.
    attributes:
      id:
        description: Unique reaction identifier (e.g., PGI, SCS).
        identifier: true
        required: true
      name:
        description: Human-readable reaction name.
      reversibility:
        description: >-
          Whether the reaction can proceed in both directions.
        slot_uri: fluxo:FLUXO_0000007
        range: boolean
        required: true
        ifabsent: "true"
      reaction_type:
        description: The type of reaction.
        range: ReactionTypeEnum
      reactants:
        description: Reactant (educt) participants consumed by the reaction.
        range: ReactionParticipant
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
      products:
        description: >-
          Product participants produced by the reaction. Recommended
          rather than strictly required because boundary reactions
          (sink, demand) legitimately have no products; a conditional
          rule (required unless boundary reaction) is deferred to Phase 5.
        range: ReactionParticipant
        multivalued: true
        inlined_as_list: true
        recommended: true
      atom_transition_variants:
        description: >-
          Atom transition variants for this reaction. Multiple variants
          exist when symmetric compounds create ambiguity in atom
          transitions. Recommended rather than required: isotope-based
          MFA requires transitions for reactions among carbon-tracked
          metabolites, but stoichiometry-based methods (FBA) and
          reactions among untracked metabolites have none. The
          conditional rule (required when n_tracked_atoms > 0) is
          deferred to Phase 5.
        range: AtomTransitionVariant
        multivalued: true
        inlined_as_list: true
        recommended: true
      is_lumped:
        description: >-
          Whether this is a lumped reaction combining multiple steps.
        slot_uri: fluxo:FLUXO_0000066
        range: boolean
        ifabsent: "false"
      is_pseudo:
        description: >-
          Whether this is a pseudo-reaction with no biological counterpart.
        slot_uri: fluxo:FLUXO_0000065
        range: boolean
        ifabsent: "false"
      aliases:
        description: >-
          Tool-namespaced alternative identifiers (e.g.,
          "influx_si:v5", "freeflux:R1"). The canonical↔native ID
          mapping is new information present in no native file — it
          lives in the dataset, once per entity.

  ReactionParticipant:
    class_uri: fluxo:FLUXO_0000185
    description: >-
      A metabolite participating in a reaction with a specific
      stoichiometric coefficient.
    attributes:
      metabolite_id:
        description: >-
          Reference to the metabolite identifier in the network model.
        range: NetworkMetabolite
        required: true
      stoichiometry:
        description: >-
          Stoichiometric coefficient (absolute value). The participant's
          role (reactant vs product) is determined by which list it
          appears in on NetworkReaction.
        slot_uri: fluxo:FLUXO_0000205
        range: float
        ifabsent: float(1.0)

  AtomTransitionVariant:
    class_uri: fluxo:FLUXO_0000224
    description: >-
      A variant of atom transitions for a reaction. E.g. reactions involving
      symmetric compounds have multiple variants because the atom mapping
      is ambiguous.
    attributes:
      variant_id:
        description: >-
          Identifier for this variant (e.g., "SCS___1", "SCS___2").
        required: true
      ratio:
        description: >-
          Likelihood (0.0-1.0) of this atom-transition variant, used for
          scrambling reactions where symmetric compounds make the atom
          mapping ambiguous. Should sum to 1.0 across all variants of a
          reaction.
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      transitions:
        description: Individual atom-to-atom transition mappings.
        range: AtomTransition
        multivalued: true
        inlined_as_list: true

  AtomTransition:
    class_uri: fluxo:FLUXO_0000155
    description: >-
      A single atom-to-atom mapping from a reactant atom to a product
      atom in a reaction.
    attributes:
      reactant_metabolite_id:
        description: >-
          Identifier of the reactant metabolite containing the source
          atom.
        range: NetworkMetabolite
        required: true
      reactant_atom_index:
        description: >-
          Zero-based index of the atom position in the reactant
          metabolite.
        slot_uri: fluxo:FLUXO_0000069
        range: integer
        minimum_value: 0
        required: true
      product_metabolite_id:
        description: >-
          Identifier of the product metabolite containing the destination
          atom.
        range: NetworkMetabolite
        required: true
      product_atom_index:
        description: >-
          Zero-based index of the atom position in the product metabolite.
        slot_uri: fluxo:FLUXO_0000069
        range: integer
        minimum_value: 0
        required: true
      annotation_type:
        description: The notation used for this atom transition.
        slot_uri: fluxo:FLUXO_0000072
        range: AtomAnnotationTypeEnum

  FluxConstraint:
    class_uri: fluxo:FLUXO_0000068
    description: >-
      A constraint on metabolic flux values in the network model.
    attributes:
      id:
        description: Unique identifier for the constraint.
        identifier: true
        required: true
      reaction_id:
        description: >-
          Reference to the reaction this constraint applies to.
        range: NetworkReaction
        required: true
      constraint_type:
        description: The type of constraint.
        range: ConstraintTypeEnum
        required: true
      lower_bound:
        description: Lower bound for the flux value.
        range: float
      upper_bound:
        description: Upper bound for the flux value.
        range: float
      fixed_value:
        description: Fixed value for equality constraints.
        range: float
      expression:
        description: >-
          Mathematical expression for linear combination constraints.
        slot_uri: fluxo:FLUXO_0000223

  PoolSizeConstraint:
    class_uri: fluxo:FLUXO_0000068
    description: >-
      A constraint on metabolite pool size values in the network model.
      Parallel to FluxConstraint but applies to a metabolite rather than
      a reaction.
    attributes:
      id:
        description: Unique identifier for the constraint.
        identifier: true
        required: true
      metabolite_id:
        description: >-
          Reference to the metabolite this constraint applies to.
        range: NetworkMetabolite
        required: true
      constraint_type:
        description: The type of constraint.
        range: ConstraintTypeEnum
        required: true
      lower_bound:
        description: Lower bound for the pool size value.
        range: float
      upper_bound:
        description: Upper bound for the pool size value.
        range: float
      fixed_value:
        description: Fixed value for equality constraints.
        range: float
      expression:
        description: >-
          Mathematical expression for linear combination constraints.
        slot_uri: fluxo:FLUXO_0000223
