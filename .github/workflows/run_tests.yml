# Two jobs:
#   lint  - pre-commit (ruff, mypy, codespell, yamllint, linkml-lint,
#           linkml-validate-examples, gen-pydantic freshness) once, on Linux;
#           the checks do not depend on the OS or Python version.
#   tests - pytest on every OS / Python combination.
#
# pre-commit runs through `uv run` from the project environment rather than
# pre-commit/action: setup-uv activates a uv-created venv, which has no pip,
# so the action's `python -m pip install pre-commit` fails.

name: Run tests

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          # Pin uv version for reproducible CI runs.
          version: "0.5.15"
          python-version: "3.12"

      - name: Install fluxolink
        run: uv sync --extra dev

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.15"
          python-version: ${{ matrix.python-version }}

      - name: Install fluxolink
        run: uv sync --extra dev

      - name: run pytest
        run: uv run pytest tests
