# This workflow checks out the repo, installs the package and runs pre-commit
# (ruff, mypy, codespell, yamllint, linkml-lint, linkml-validate-examples, and
# the gen-pydantic freshness check) followed by pytest.

name: Run tests

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  run_tests:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:

    - uses: actions/checkout@v4

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v5
      with:
        # Pin uv version for reproducible CI runs.
        version: "0.5.15"
        python-version: ${{ matrix.python-version }}

    - name: Install fluxolink
      run: uv sync --extra dev

    - name: pre-commit checks
      uses: pre-commit/action@v3.0.1

    - name: run pytest
      run: uv run pytest tests
