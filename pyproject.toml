[project]
name = "fluxolink"
version = "0.1.0"
description = "LinkML data model for 13C-MFA simulation studies, grounded in the FLUXO ontology"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "fluxolink" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "linkml>=1.7.0",
    "linkml-runtime>=1.7.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
fluxolink-validate = "fluxolink.validate:main"
fluxolink-flatten = "fluxolink.flatten:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxolink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "schema: tests for schema validation",
    "unit: unit tests",
    "integration: integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]
# The datamodel is generated by gen-pydantic; do not lint it.
extend-exclude = ["src/fluxolink/datamodel/fluxolink.py"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "TCH",     # flake8-type-checking
    "RUF",     # ruff-specific
    "D",       # pydocstyle (docstring enforcement)
]

ignore = [
    "D100",    # missing docstring in module (handled by D104)
    "D104",    # missing docstring in __init__.py
    "D203",    # blank line before class (conflicts with D211)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Emits SVG/mxGraph markup; breaking the literals at 99 columns hurts more
# than it helps. Every other rule still applies.
"scripts/gen_erd.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "fluxolink.datamodel.fluxolink"
ignore_errors = true

[[tool.mypy.overrides]]
module = "linkml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "linkml_runtime.*"
ignore_missing_imports = true
