    checksum: "sha256:d673b8e89e705d8d1c2c9a665a516c84df7a16d334d65c3cc87d99b62582313e"
    file_size_bytes: 498
  - id: SF_miso_sim
    path: simple_model_res/simple_model.miso.sim
    format: MTF
    role: results
    checksum: "sha256:e531fe9cf4836c04bda1994f8903d5d6eb9f4d78fc1d5cb3c7c0c1115930c672"
    file_size_bytes: 412
  - id: SF_mflux_sim
    path: simple_model_res/simple_model.mflux.sim
    format: MTF
    role: results
    checksum: "sha256:f1e2b545bb0a1b1352ac05a703fb3a22d082edeee853b24c44848a88ecd075de"
    file_size_bytes: 74
  - id: SF_stat
    path: simple_model_res/simple_model.stat
    format: MTF
